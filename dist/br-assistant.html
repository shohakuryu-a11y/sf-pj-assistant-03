const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
function analyze(text){
 const t=norm(text), score={}, why={};
 const add=(ref,n,reason)=>{if(!FS[ref])return;score[ref]=(score[ref]||0)+n;(why[ref]=why[ref]||new Set()).add(reason)};
 const concepts=KN.concepts.filter(c=>c.aliases.some(a=>norm(a).length>=2&&t.includes(norm(a))));
 concepts.forEach(c=>c.refs.forEach(r=>add(r,6,'概念「'+c.name+'」')));
 for(const f of Object.values(FS)){
  if(f.status!=='active') continue;
  if(norm(f.label).length>=2&&t.includes(norm(f.label))) add(f.ref,8,'ラベル');
  f.syn.forEach(s=>{if(norm(s).length>=2&&t.includes(norm(s))) add(f.ref,5,'同義語「'+s+'」')});
  if(norm(f.en).length>=4&&t.includes(norm(f.en))) add(f.ref,4,'英語ラベル');
 }
 const pickHits=[];
 for(const [pid,p] of Object.entries(PL)) for(const [code,v] of Object.entries(p.values)){
  if(norm(v.ja).length>=2&&t.includes(norm(v.ja))){pickHits.push({pid,code,ja:v.ja});
   Object.values(FS).filter(f=>f.t.pl===pid).forEach(f=>add(f.ref,4,'選択肢「'+v.ja+'」'))}
 }
 const recHits=[];
 for(const [o,rs] of Object.entries(REC)) for(const [code,r] of Object.entries(rs)){
  if(norm(r.name).length>=2&&t.includes(norm(r.name))){recHits.push({obj:o,code,name:r.name});
   Object.values(FS).filter(f=>f.t.obj===o).forEach(f=>add(f.ref,4,(o==='FOEventReason'?'イベント事由「':'レコード「')+r.name+'」'))}
 }
 /* ピックリスト自体のラベル・同義語 → そのピックリストを使う項目 */
 for(const p of Object.values(PL)){
  if(p.status!=='A') continue;
  const w=[p.label,...p.syn].find(s=>norm(s).length>=2&&t.includes(norm(s)));
  if(w) Object.values(FS).filter(f=>f.t.pl===p.id).forEach(f=>add(f.ref,3,'ピックリスト「'+w+'」'));
 }
 /* オブジェクト自体のラベル・同義語 → オブジェクトの候補 */
 const objHits=[];
 for(const o of Object.values(OBJ)){
  if(o.status!=='active') continue;
  const w=[o.label,...o.syn].find(s=>norm(s).length>=2&&t.includes(norm(s)));
  if(w) objHits.push({id:o.id,word:w});
 }
 const fields=Object.keys(score).sort((a,b)=>score[b]-score[a]).map(r=>({ref:r,score:score[r],why:[...why[r]]}));
 const objScore={}; fields.forEach(f=>{const o=FS[f.ref].obj;objScore[o]=(objScore[o]||0)+f.score});
 objHits.forEach(h=>{objScore[h.id]=(objScore[h.id]||0)+10});
 let objects=Object.keys(objScore).sort((a,b)=>objScore[b]-objScore[a]);
 if(!objects.length) objects=['EmpJob'].filter(o=>OBJ[o]);
 return {concepts,fields,objects,pickHits,recHits,objHits};
}

function normalize(sol){

 if(sol.branches!=null){
  if(Array.isArray(sol.branches)) branches=sol.branches.slice(); else issues.push('「branches」は配列にしてください');
  if(sol.if!=null||sol.then!=null) issues.push('「branches」と「if / then」が両方あります。どちらか一方にしてください');

  if(sol.if!=null||sol.then!=null) branches.push({if:sol.if,then:sol.then});
  const ei=sol.else_if!=null?sol.else_if:sol.elseIf;
  if(ei!=null){ if(Array.isArray(ei)) branches.push(...ei); else issues.push('「else_if」は配列にしてください') }

 v.querySelector('#scn').onchange=e=>{scn=e.target.value; if(an){addScnBases(); drawS2()}};
 /* シナリオの base object が決まっている（入社の Employee Information など）ときは、そのオブジェクトをプロンプトに含める */
 const addScnBases=()=>{const s=SCN[scn]; if(s&&s.bases) sel=[...new Set([...s.bases.filter(id=>OBJ[id]),...sel])]};
 /* step: req → copy → paste → (fix → repaste → paste …) → done */

function commit(ops,msg){ops.forEach(o=>OPS.push(o));store.set(KEY.ops,OPS);rebuild();if(msg)toast(msg)}
function persistOps(){store.set(KEY.ops,OPS);rebuild()}
/* 編集画面の「元の値」を、現在のデータモデルの値で置き換える（なくなったキーも消す） */
const splitSyn=s=>{const a=String(s||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean);return a.length?a:undefined};
function resetTo(raw,src,drop){Object.keys(raw).forEach(k=>delete raw[k]);Object.assign(raw,clone(src||{}));(drop||[]).forEach(k=>delete raw[k]);return raw}
const P={obj:id=>['objects',id],field:ref=>{const i=ref.indexOf('.');return ['objects',ref.slice(0,i),'fields',ref.slice(i+1)]},
 pl:id=>['picklists',id],val:(id,c)=>['picklists',id,'values',c],rec:(o,c)=>['records',o,c]};
const ps=p=>JSON.stringify(p);
const under=(op,path)=>{const a=ps(op.path),b=ps(path).slice(0,-1);return a===b+']'||a.startsWith(b+',')};
/* 1 つのパスに対する変更履歴（新しい順）。取り消せるのは、そのパスと重なる後の変更がないものだけ */
function historyOf(path,depthLimit){
 return OPS.filter(o=>under(o,path)&&(depthLimit==null||o.path.length<=path.length+depthLimit)).slice().reverse();
}
function canRevert(op){
 if(op.reverted) return false;
 const i=OPS.indexOf(op);
 return !OPS.slice(i+1).some(o=>!o.reverted&&(under(o,op.path)||under(op,o.path)));
}
function revertOp(id){const op=OPS.find(o=>o.id===id);if(!op||!canRevert(op))return;op.reverted=true;persistOps();toast('変更を取り消しました')}
/* 現在値と新しい値の差分を、キーごとの set / del 操作にする */
function diffOps(path,cur,next,keys,note){
 const out=[];
 keys.forEach(k=>{
  const a=cur?cur[k]:undefined, b=next[k];
  if(same(a,b)) return;
  const empty=b===undefined||b===null||b===''||(Array.isArray(b)&&!b.length);
  if(empty&&a===undefined) return;
  out.push(empty?newOp([...path,k],'del',undefined,a,note):newOp([...path,k],'set',b,a,note));
 });
 return out;
}
const ATTR_JA={label:'日本語ラベル',en:'英語ラベル',kind:'種類',status:'状態',effectiveDated:'有効日付',baseObject:'base object にできる',events:'使える event',crossWrite:'クロスエンティティ',associations:'アソシエーション',
 dataType:'データ型',source:'参照先',parentField:'親項目',required:'必須',readOnly:'読み取り専用',maxLength:'最大長',decimals:'小数桁数',desc:'意味の説明',syn:'同義語',
 parent:'親',ja:'日本語ラベル',name:'名称',start:'有効開始日',end:'有効終了日',attrs:'項目の値',values:'値'};
function fmtVal(k,x){
 if(x===undefined||x===null||x==='') return '（なし）';
 if(k==='status') return x==='active'||x==='A'?'有効':'無効';
 if(k==='kind') return KIND_JA[x]||x;
 if(k==='dataType') return DT[x]?DT[x].ja:x;
 if(typeof x==='boolean') return x?'はい':'いいえ';
 if(k==='crossWrite') return (x.targets||[]).map(objLabel).join('、')+((x.events||[]).length?`（${x.events.join('・')}）`:'');
 if(k==='associations') return x.length?x.map(a=>`${a.id} → ${objLabel(a.target)}`).join('、'):'なし';
 if(Array.isArray(x)) return x.join('、')||'（なし）';
 if(typeof x==='object') return Object.entries(x).map(([a,b])=>`${a}=${b}`).join('、');
 return String(x);
}
function historyHTML(path,depthLimit){
 const hs=historyOf(path,depthLimit);
 if(!hs.length) return '<div class="group"><div class="empty">まだ変更はありません</div></div>';
 return `<div class="group">${hs.map(h=>{
  const rel=h.path.slice(path.length), k=rel[rel.length-1];
  const what=!rel.length?(h.op==='del'?'削除':h.before===undefined?'追加':'置き換え'):`${rel.length>1?rel.slice(0,-1).join('.')+' › ':''}${ATTR_JA[k]||k}`;
  const desc=!rel.length?'':h.op==='del'?`${fmtVal(k,h.before)} を削除`:`${fmtVal(k,h.before)} から ${fmtVal(k,h.value)} に変更`;
  return `<div class="row"><div class="main"><div class="t" style="font-size:14px">${esc(what)}${h.reverted?'<span class="pill inactive">取り消し済み</span>':''}</div>${desc?`<div class="s">${esc(desc)}</div>`:''}<div class="s">${esc(h.at)}${h.note?'・'+esc(h.note):''}</div></div>${canRevert(h)?`<button class="linkbtn" data-revert="${esc(h.id)}">取り消す</button>`:''}</div>`}).join('')}</div>`;
}

function createModelMap(host){
 const SVGNS='http://www.w3.org/2000/svg', GRID=24;

 let E=[], OUT={}, IN={};
 function build(){
  E=[];
  for(const id of Object.keys(OBJ)){
   const o=OBJ[id], ref={}, pls={};
   fieldsOf(id).forEach(f=>{
    if(f.status!=='active') return;
    if(f.t.obj&&OBJ[f.t.obj]) (ref[f.t.obj]=ref[f.t.obj]||[]).push(f);
    if(f.t.pl&&PL[f.t.pl]) (pls[f.t.pl]=pls[f.t.pl]||[]).push(f);
   });
   Object.entries(ref).forEach(([t,fs])=>E.push({from:id,to:t,kind:'ref',vias:fs.map(f=>({n:f.name,l:f.label})),many:false}));
   Object.entries(pls).forEach(([t,fs])=>E.push({from:id,to:plId(t),kind:'pl',vias:fs.map(f=>({n:f.name,l:f.label})),many:false}));
   o.associations.forEach(a=>{if(a&&OBJ[a.target]) E.push({from:id,to:a.target,kind:REL[a.type]?a.type:'association',vias:[{n:a.id,l:a.label||a.id}],many:a.multiplicity==='1:n'})});
   ((o.crossWrite&&o.crossWrite.targets)||[]).forEach(t=>{if(OBJ[t]) E.push({from:id,to:t,kind:'cross',vias:[{n:'crossWrite',l:'値を設定できる'}],many:false})});
  }
  for(const p of Object.values(PL)) if(p.parent&&PL[p.parent]) E.push({from:plId(p.id),to:plId(p.parent),kind:'cascade',vias:[{n:'parent',l:'親ピックリスト'}],many:false});
  E.forEach((e,i)=>e.i=i);
  OUT={}; IN={};
  E.forEach(e=>{(OUT[e.from]=OUT[e.from]||[]).push(e);(IN[e.to]=IN[e.to]||[]).push(e)});
 }

 const edgeOn=e=>F[REL[e.kind].g];
 function neighbors(id){
  const s=new Set();
  (OUT[id]||[]).forEach(e=>{if(edgeOn(e)) s.add(e.to)});
  if(F.in) (IN[id]||[]).forEach(e=>{if(edgeOn(e)) s.add(e.from)});

 }

 function expand(id){
  const p=nodes.get(id), hs=hidden(id);
  if(!hs.length){toast('これ以上開ける支線はありません');refresh();return}
  const o=p.owner&&nodes.get(p.owner);
  let a0,spread;
  if(o){a0=Math.atan2(p.ty-o.ty,p.tx-o.tx);spread=Math.min(Math.PI*1.3,Math.max(.6,hs.length*.42))}
  else{a0=-Math.PI/2;spread=Math.PI*2}
  const r=Math.max(300,(hs.length*215)/spread);
  hs.forEach((h,i)=>{
   const a=o?a0+(hs.length===1?0:(i/(hs.length-1)-.5))*spread:a0+i*(Math.PI*2/hs.length);
   addNode(h,p.tx+Math.cos(a)*r,p.ty+Math.sin(a)*r*.82,id,p.x,p.y);
  });
  relax(hs); refresh(); kick(); save();
 }
 function collapse(id){removeTree(id);if(SEL&&!nodes.has(SEL))SEL=null;refresh();kick();save()}
 function toggle(id){SEL=id;owned(id).length?collapse(id):expand(id)}
 /* 節点を図から外す。その節点から開いた支線は残し、つながりの親を外す */
 function removeNode(id){
  if(!nodes.has(id)) return;
  nodes.delete(id);
  for(const n of nodes.values()) if(n.owner===id) n.owner=null;
  if(SEL===id) SEL=null; if(HOV===id) HOV=null;
  if(BASE===id){BASE=null;R=null;RINGS=[];bs.value='';rg.innerHTML=''}
  refresh(); kick(); save();
  toast(`${labelOf(id)} を図から外しました`);
 }
 /* 重なりを避ける（新しい節点だけ動かす） */
 function relax(ids){
  const all=[...nodes.values()];
  for(let it=0;it<60;it++){
   let moved=false;
   for(const id of ids){
    const a=nodes.get(id), sa=size(id);
    for(const b of all){
     if(b===a) continue;
     const sb=size(b.id), dx=a.tx-b.tx, dy=a.ty-b.ty;
     const ox=(sa.w+sb.w)/2+36-Math.abs(dx), oy=(sa.h+sb.h)/2+30-Math.abs(dy);
     if(ox>0&&oy>0){
      moved=true; const hz=ox<oy*2.2, sx=dx>=0?1:-1, sy=dy>=0?1:-1;
      if(hz) a.tx+=sx*(ox/2+1); else a.ty+=sy*(oy/2+1);
      if(ids.includes(b.id)){if(hz) b.tx-=sx*ox/2; else b.ty-=sy*oy/2}
     }
    }
   }
   if(!moved) break;
  }
 }

 function openDetail(id){if(!exists(id))return;push('cat',isPl(id)?picklistView(raw(id)):objView(id))}
 insp.addEventListener('click',ev=>{

 });
 function reveal(id,near){
  if(!exists(id)) return;

   if(near&&nodes.has(near)){
    const p=nodes.get(near), a=Math.random()*Math.PI*2;
    addNode(id,p.tx+Math.cos(a)*320,p.ty+Math.sin(a)*240,near,p.tx,p.ty);
   }else{
    /* 基準の節点がないとき（何もない図に検索から出したときなど）は、今見えている画面の中央に置く */
    const r=rect(), cx=Math.round((r.width/2-view.x)/view.k/GRID)*GRID, cy=Math.round((r.height/2-view.y)/view.k/GRID)*GRID;

 /* ---- base object モード（reachFrom の結果を段数ごとの同心円に並べる） ---- */
 function setBase(id,keep){
  if(id&&!OBJ[id]) id='';
  bs.value=id||'';
  BASE=id||null; R=BASE?reachFrom(BASE):null; RINGS=[]; rg.innerHTML='';
  if(BASE&&!keep){
   nodes.clear(); clearDom();
   const by={};
   Object.entries(R).forEach(([o,r])=>(by[r.depth]=by[r.depth]||[]).push(o));
   addNode(BASE,0,0,null);
   const ang={[BASE]:0}; let rPrev=0;
   for(let d=1;d<=nav();d++){
    const list=by[d]||[]; if(!list.length) continue;
    const par=o=>R[o].path[R[o].path.length-1].from;
    list.sort((a,b)=>(ang[par(a)]??0)-(ang[par(b)]??0));
    const r=Math.max(rPrev+300,list.length*232/(Math.PI*2)); rPrev=r; RINGS.push(r);
    list.forEach((o,i)=>{const a=-Math.PI/2+(i+.5)*(Math.PI*2/list.length);ang[o]=a;addNode(o,Math.cos(a)*r,Math.sin(a)*r,par(o),0,0)});
   }
   SEL=BASE; refresh(); kick(); fit(true); save();
   toast(`${labelOf(BASE)} からたどれるのは ${Object.keys(R).length-1} 件です（${nav()} 段まで）`);
  }else if(BASE&&keep){
   const by={}; Object.values(R).forEach(r=>by[r.depth]=(by[r.depth]||0)+1);
   let rPrev=0; for(let d=1;d<=nav();d++){if(!by[d])continue;const r=Math.max(rPrev+300,by[d]*232/(Math.PI*2));rPrev=r;RINGS.push(r)}
   refresh();
  }else{refresh();kick();save()}
 }

 /* ---- 視点 ---- */
 const rect=()=>vp.getBoundingClientRect();
 const narrow=()=>host.classList.contains('narrow');
 function fly(id){
  const n=nodes.get(id); if(!n) return;
  const r=rect(), off=!narrow()&&!insp.hidden?170:0, offY=narrow()&&!insp.hidden?r.height*.22:0;
  view.tk=Math.max(view.k,.85); view.tx=r.width/2-off-n.tx*view.tk; view.ty=r.height/2-offY-n.ty*view.tk; viewAnim=true; kick();
 }
 function bounds(){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const n of nodes.values()){const s=size(n.id);x1=Math.min(x1,n.tx-s.w/2);y1=Math.min(y1,n.ty-s.h/2);x2=Math.max(x2,n.tx+s.w/2);y2=Math.max(y2,n.ty+s.h/2)}
  if(RINGS.length&&BASE&&nodes.has(BASE)){const b=nodes.get(BASE),r=RINGS[RINGS.length-1]+40;x1=Math.min(x1,b.tx-r);y1=Math.min(y1,b.ty-r);x2=Math.max(x2,b.tx+r);y2=Math.max(y2,b.ty+r)}
  return {x1,y1,x2,y2};
 }
 function fit(anim){
  if(!nodes.size) return;
  const b=bounds(), r=rect(); if(!r.width) return;
  const top=70, side=!narrow()&&!insp.hidden?340:0, bottom=narrow()?(insp.hidden?30:r.height*.5):30;
  const k=Math.min((r.width-side-60)/(b.x2-b.x1),(r.height-top-bottom-30)/(b.y2-b.y1),1.15);
  view.tk=Math.max(.15,k); view.tx=(r.width-side)/2-(b.x1+b.x2)/2*view.tk; view.ty=top+(r.height-top-bottom)/2-(b.y1+b.y2)/2*view.tk;
  if(anim){viewAnim=true;kick()}else{view.x=view.tx;view.y=view.ty;view.k=view.tk;applyView();readout()}
  save();
 }
 function zoomAt(f,cx,cy){
  const k=Math.min(2.6,Math.max(.12,view.k*f)), wx=(cx-view.x)/view.k, wy=(cy-view.y)/view.k;
  view.k=view.tk=k; view.x=view.tx=cx-wx*k; view.y=view.ty=cy-wy*k; viewAnim=false; applyView(); readout(); mini(); save();
 }
 let lastW={x:0,y:0};
 function readout(){$('.read').textContent=`X ${Math.round(lastW.x)} · Y ${Math.round(lastW.y)} · ${Math.round(view.k*100)}%`}
 function toWorld(cx,cy){const r=rect();return {x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k}}

 /* ---- 操作：背景のドラッグで移動、ホイール・ピンチで拡大縮小、節点のクリックで支線の開閉、ドラッグで移動（方眼に吸着）、ダブルクリックで詳細 ---- */
 const ptr=new Map(); let drag=null, pinch=null, lastTap={id:null,t:0};
 vp.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('.nx,.nd')) return;
  try{vp.setPointerCapture(ev.pointerId)}catch(e){}
  ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};if(drag&&drag.n)drag.n.drag=false;drag=null;return}
  const el=ev.target.closest('.bm-n');
  if(el){const n=nodes.get(el.dataset.id),w=toWorld(ev.clientX,ev.clientY);drag={n,ox:w.x-n.x,oy:w.y-n.y,sx:ev.clientX,sy:ev.clientY,moved:false}}
  else{drag={pan:true,sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y,moved:false};vp.classList.add('panning')}
 });
 vp.addEventListener('pointermove',ev=>{
  const w=toWorld(ev.clientX,ev.clientY); lastW=w; readout();
  if(ptr.has(ev.pointerId)) ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&ptr.size===2){const [a,b]=[...ptr.values()],r=rect();zoomAt(pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d/view.k,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
  if(!drag){const el=ev.target.closest('.bm-n'),h=el?el.dataset.id:null;if(h!==HOV){HOV=h;highlight()}return}
  const dx=ev.clientX-drag.sx, dy=ev.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>4) drag.moved=true;
  if(!drag.moved) return;
  if(drag.pan){view.x=view.tx=drag.vx+dx;view.y=view.ty=drag.vy+dy;viewAnim=false;applyView();mini()}
  else{const n=drag.n;n.drag=true;n.x=n.tx=w.x-drag.ox;n.y=n.ty=w.y-drag.oy;placeNodes();drawEdges()}
 });
 function endPtr(ev){
  ptr.delete(ev.pointerId);
  if(pinch){if(ptr.size<2)pinch=null;return}
  vp.classList.remove('panning');
  if(!drag) return;
  const d=drag; drag=null;
  if(d.pan){if(!d.moved&&SEL){SEL=null;refresh()}else if(d.moved)save();return}
  const n=d.n; n.drag=false;
  if(d.moved){n.tx=Math.round(n.tx/GRID)*GRID;n.ty=Math.round(n.ty/GRID)*GRID;kick();mini();save();return}
  const now=Date.now();
  if(lastTap.id===n.id&&now-lastTap.t<350){lastTap={id:null,t:0};toggle(n.id);openDetail(n.id);return}  /* 1 回目のクリックで開閉した支線は元に戻す */
  lastTap={id:n.id,t:now};
  toggle(n.id);
 }
 vp.addEventListener('pointerup',endPtr); vp.addEventListener('pointercancel',endPtr);

 vp.addEventListener('click',ev=>{const d=ev.target.closest('.nd');if(d){removeNode(d.closest('.bm-n').dataset.id);return}const b=ev.target.closest('.nx');if(b)toggle(b.closest('.bm-n').dataset.id)});
 vp.addEventListener('keydown',ev=>{const el=ev.target.closest('.bm-n');if(!el)return;if(ev.key==='Enter'){ev.preventDefault();openDetail(el.dataset.id)}else if(ev.key===' '){ev.preventDefault();toggle(el.dataset.id)}else if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();removeNode(el.dataset.id)}});
 vp.addEventListener('wheel',ev=>{ev.preventDefault();const r=rect();zoomAt(Math.exp(-ev.deltaY*(ev.ctrlKey?.01:.0015)),ev.clientX-r.left,ev.clientY-r.top)},{passive:false});

 host.addEventListener('click',ev=>{

 /* ---- ミニマップ ---- */
 let mmT=null;
 function mini(){
  mc.clearRect(0,0,mm.width,mm.height);
  const r=rect(); if(!nodes.size||!r.width) return;
  const b=bounds(), vx1=-view.x/view.k, vy1=-view.y/view.k, vx2=vx1+r.width/view.k, vy2=vy1+r.height/view.k;
  const X1=Math.min(b.x1,vx1)-60, Y1=Math.min(b.y1,vy1)-60, X2=Math.max(b.x2,vx2)+60, Y2=Math.max(b.y2,vy2)+60;
  const s=Math.min(mm.width/(X2-X1),mm.height/(Y2-Y1)), ox=(mm.width-(X2-X1)*s)/2, oy=(mm.height-(Y2-Y1)*s)/2;
  mmT={X1,Y1,s,ox,oy};
  mc.strokeStyle='#75787B'; mc.globalAlpha=.4; mc.lineWidth=1;
  for(const e of VIS){const a=nodes.get(e.from),c=nodes.get(e.to);mc.beginPath();mc.moveTo(ox+(a.x-X1)*s,oy+(a.y-Y1)*s);mc.lineTo(ox+(c.x-X1)*s,oy+(c.y-Y1)*s);mc.stroke()}
  for(const n of nodes.values()){
   const z=size(n.id); mc.fillStyle=KCOL[kindOf(n.id)]; mc.globalAlpha=R&&!isPl(n.id)&&!R[n.id]?.3:1;
   mc.fillRect(ox+(n.x-z.w/2-X1)*s,oy+(n.y-z.h/2-Y1)*s,Math.max(2,z.w*s),Math.max(2,z.h*s));
  }
  mc.globalAlpha=1; mc.strokeStyle='#86BC25'; mc.lineWidth=3;
  mc.strokeRect(ox+(vx1-X1)*s,oy+(vy1-Y1)*s,(vx2-vx1)*s,(vy2-vy1)*s);
 }
 mm.addEventListener('pointerdown',ev=>{
  if(!mmT) return; const rc=mm.getBoundingClientRect(), r=rect();
  const wx=mmT.X1+((ev.clientX-rc.left)*mm.width/rc.width-mmT.ox)/mmT.s, wy=mmT.Y1+((ev.clientY-rc.top)*mm.height/rc.height-mmT.oy)/mmT.s;
  view.tk=view.k; view.tx=r.width/2-wx*view.k; view.ty=r.height/2-wy*view.k; viewAnim=true; kick();
 });

 /* ---- 開始・データの再読み込み ---- */
 function start(){
  BASE=null; R=null; RINGS=[]; bs.value='';
  nodes.clear(); clearDom(); SEL=null;
  /* 何もない図から始める。原点が画面の中央に来るようにする */
  const r=rect(); view.k=view.tk=1; view.x=view.tx=Math.round(r.width/2); view.y=view.ty=Math.round(r.height/2); viewAnim=false;
  applyView(); readout(); refresh(); save();
 }
 function restore(){
  const s=store.get(SKEY,null);
  if(!s||!Array.isArray(s.nodes)||!s.nodes.length) return false;
  Object.assign(F,s.F||{});
  s.nodes.forEach(([id,x,y,owner])=>{if(exists(id)) nodes.set(id,{id,x,y,tx:x,ty:y,owner:owner&&exists(owner)?owner:null,born:false})});
  if(!nodes.size) return false;
  if(s.base&&OBJ[s.base]) setBase(s.base,true);
  if(Array.isArray(s.view)){[view.x,view.y,view.k]=s.view;view.tx=view.x;view.ty=view.y;view.tk=view.k}
  return true;
 }
 /* データモデルが変わったとき（詳細画面から戻ったとき）に、つながりを作り直す */
 function reload(){
  build(); fillLists();
  for(const id of [...nodes.keys()]) if(!exists(id)) nodes.delete(id);
  for(const n of nodes.values()) if(n.owner&&!nodes.has(n.owner)) n.owner=null;
  if(BASE&&!OBJ[BASE]){BASE=null;R=null;RINGS=[]}
  if(BASE){const keepSel=SEL;setBase(BASE,true);SEL=keepSel}
  if(SEL&&!nodes.has(SEL)) SEL=null;
  clearDom(); refresh(); placeNodes(); drawEdges();
 }
 new ResizeObserver(()=>{
  const r=rect(); host.classList.toggle('narrow',r.width<720);
  if(r.width&&!sized){sized=true;if(restored){applyView();readout()}else start()}
  else if(r.width){applyView();mini()}
 }).observe(host);
 build(); fillLists();
 restored=restore();
 if(restored){refresh();placeNodes();drawEdges();applyView()}
 return {reload};
}

}

   </section>
   <div class="hsec"><h2>すぐに始める</h2></div>
   <div class="qa">
    <button type="button" data-go="make"><span class="ic">${I.make}</span><b>ルールを作る</b><small>業務の要件を文章で書いて、AI に渡すプロンプトを作ります</small></button>
    <button type="button" data-go="check"><span class="ic">${I.check}</span><b>ルールを検証する</b><small>手元の設計案（JSON）や文章のルールを、データモデルで検証します</small></button>
    <button type="button" data-go="cat"><span class="ic">${I.cat}</span><b>データモデルを見る</b><small>オブジェクト・項目・ピックリスト・レコードを確認・編集します</small></button>
    <button type="button" data-go="map"><span class="ic">${I.map}</span><b>構造図を開く</b><small>オブジェクトのつながりと、base object からたどれる経路を図で見ます</small></button>
   </div>
   <div class="hsec"><h2>機能</h2><span class="sbhint">左のサイドバーからも開けます</span></div>
   <div class="mods">
    <section class="mod">
     <div class="mh"><span class="ic">${I.make}</span><div><b>ビジネスルール設計</b><small>ルール作成・ルール検証・履歴</small></div></div>
     <div class="nums"><div class="num"><b>${HIST.length}</b><span>検証した設計案</span></div><div class="num"><b>${nOk}</b><span>合格</span></div><div class="num"><b>${HIST.length-nOk}</b><span>要修正</span></div></div>
     <div class="links"><button type="button" class="pri" data-go="make">ルール作成</button><button type="button" data-go="check">ルール検証</button><button type="button" data-go="hist">履歴</button></div>
    </section>
    <section class="mod">
     <div class="mh"><span class="ic">${I.cat}</span><div><b>データモデル管理</b><small>一覧・構造図・レコード・変更の書き出し</small></div></div>
     <div class="nums"><div class="num"><b>${nObj}</b><span>オブジェクト</span></div><div class="num"><b>${nFld}</b><span>項目</span></div><div class="num"><b>${nPl}</b><span>ピックリスト</span></div></div>
     <div class="links"><button type="button" class="pri" data-go="cat">一覧</button><button type="button" data-go="map">構造図</button></div>
    </section>
   </div>
   <div class="hgrid">
    <section class="hcard"><div class="ct">最近の検証</div>
     ${recent.length?recent.map((x,i)=>`<button type="button" class="hr" data-h="${esc(x.id)}"><div class="dotic" style="background:${res[i]?'var(--green)':'var(--red)'}">${res[i]?okIcon:ngIcon}</div><div class="main"><div class="t">${esc(x.sol.intent||x.request||'（要件なし）')}</div><div class="s">${esc(x.at)}・${res[i]?'合格':'要修正'}</div></div>${chevron}</button>`).join('')
      +(HIST.length>recent.length?`<button type="button" class="hr" data-go="hist"><div class="main"><div class="t" style="color:var(--tint)">すべての履歴（${HIST.length} 件）</div></div>${chevron}</button>`:'')
      :'<div class="none">まだ検証した設計案はありません。「ルールを作る」から始めると、検証した結果がここに表示されます。</div>'}
    </section>
    <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
     <section class="hcard"><div class="ct">テナント</div>

     </section>

   </div>`;
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='map')openCat(true);else if(g==='cat')openCat(false);else showTab(g)});
  v.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const x=HIST.find(y=>y.id===b.dataset.h);if(!x)return;showTab('hist');push('hist',histDetailView(x))});
 };

if(!window.BR_CATALOG) toast('data/catalog.js を読み込めませんでした');
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}

<script>
/* =========================================================
   16. Splash: rotating dot-matrix sphere → burst on click → app
   ========================================================= */
(()=>{
 'use strict';
 const sp=document.getElementById('splash'); if(!sp) return;
 const cv=sp.querySelector('canvas'), cx=cv.getContext('2d');
 const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
 let W=0,H=0,R=0;
 function resize(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;cv.style.width=W+'px';cv.style.height=H+'px';cx.setTransform(d,0,0,d,0,0);R=Math.min(W,H)*.23}
 resize(); addEventListener('resize',resize);

 /* dot matrix on a sphere: latitude rings, dots spaced evenly along each ring */
 const P=[], RINGS=28;
 for(let i=0;i<=RINGS;i++){
  const lat=-Math.PI/2+Math.PI*i/RINGS, cr=Math.cos(lat), n=Math.max(1,Math.round(RINGS*2*cr));
  for(let j=0;j<n;j++){
   const lon=2*Math.PI*j/n+(i%2?Math.PI/n:0), rnd=()=>Math.random()-.5;
   P.push({x:cr*Math.cos(lon),y:Math.sin(lat),z:cr*Math.sin(lon),tw:Math.random()*6.283,sp:.5+Math.random()*1.3,jx:rnd(),jy:rnd(),jz:rnd()});
  }
 }
 const TEAL=[0,151,169], GREEN=[134,188,37], LIGHT=[199,229,140];
 const mix=(a,b,k)=>a.map((v,i)=>Math.round(v+(b[i]-v)*k));
 const clamp=k=>k<0?0:k>1?1:k;
 const BOOM_MS=reduce?350:1300;
 let mx=0,my=0,tmx=0,tmy=0,boom=0,ring=null,raf=0,ended=false;
 const t0=performance.now();

 sp.addEventListener('pointermove',e=>{tmx=(e.clientX/W-.5)*2;tmy=(e.clientY/H-.5)*2});

 function frame(now){
  const t=(now-t0)/1000, k=boom?clamp((now-boom)/BOOM_MS):0, e=k*k*k, fade=clamp((k-.35)/.65);
  mx+=(tmx-mx)*.05; my+=(tmy-my)*.05;
  const ry=(reduce?.6:t*.32+e*2.4)+mx*.5, rx=-.38+my*.3;
  const sy=Math.sin(ry),cy=Math.cos(ry),sx=Math.sin(rx),cxx=Math.cos(rx);
  const CX=W/2, CY=H*.44, F=3.4, breath=1+.018*Math.sin(t*1.7);
  cx.clearRect(0,0,W,H);

  /* soft core glow */
  const gl=cx.createRadialGradient(CX,CY,0,CX,CY,R*1.9);
  gl.addColorStop(0,`rgba(134,188,37,${.16*(1-fade)})`);gl.addColorStop(.5,`rgba(0,151,169,${.05*(1-fade)})`);gl.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=gl;cx.fillRect(0,0,W,H);

  /* project */
  const pts=[];
  for(const p of P){
   const d=breath*(1+e*p.sp*10);
   const x=(p.x+p.jx*e*.8)*d, y=(p.y+p.jy*e*.8)*d, z=(p.z+p.jz*e*.8)*d;
   const x1=x*cy+z*sy, z1=-x*sy+z*cy, y1=y*cxx-z1*sx, z2=y*sx+z1*cxx;
   const depth=F+z2; if(depth<.15) continue;
   const s=F/depth;
   pts.push([CX+x1*R*s, CY+y1*R*s, s, z2, p]);
  }
  pts.sort((a,b)=>b[3]-a[3]);

  cx.globalCompositeOperation='lighter';
  for(const [px,py,s,z2,p] of pts){
   const f=clamp((1-z2/breath)/2);                 // 1 = facing the viewer
   const tw=Math.sin(t*2.6+p.tw)>.985;              // occasional twinkle
   const c=tw?[255,255,255]:f>.55?mix(GREEN,LIGHT,(f-.55)/.45*.6):mix(TEAL,GREEN,f/.55);
   const a=(.16+.84*f)*(1-fade);
   if(a<=.01) continue;
   const r=(.7+1.7*f)*Math.min(s,6);
   if(f>.55||boom){cx.fillStyle=`rgba(${c},${a*.13})`;cx.beginPath();cx.arc(px,py,r*3.2,0,6.283);cx.fill()}
   cx.fillStyle=`rgba(${c},${a})`;cx.beginPath();cx.arc(px,py,r,0,6.283);cx.fill();
  }
  cx.globalCompositeOperation='source-over';

  /* shockwave from the click point */
  if(ring){
   const q=clamp((now-ring.t)/900), rr=q*Math.hypot(W,H)*.75;
   cx.lineWidth=2.5*(1-q)+.5;
   cx.strokeStyle=`rgba(134,188,37,${.85*(1-q)})`;cx.beginPath();cx.arc(ring.x,ring.y,rr,0,6.283);cx.stroke();
   cx.strokeStyle=`rgba(0,151,169,${.5*(1-q)})`;cx.beginPath();cx.arc(ring.x,ring.y,rr*.82,0,6.283);cx.stroke();
  }

  if(boom&&k>=1){finish();return}
  raf=requestAnimationFrame(frame);
 }
 function start(x,y){
  if(boom) return;
  boom=performance.now();
  if(!reduce) ring={x:x==null?W/2:x,y:y==null?H*.44:y,t:boom};
  sp.classList.add('go');
 }
 function finish(){
  if(ended) return; ended=true;
  cancelAnimationFrame(raf); removeEventListener('resize',resize); sp.remove();
 }
 sp.addEventListener('pointerdown',e=>start(e.clientX,e.clientY));
 sp.addEventListener('keydown',e=>{if(['Enter',' ','Escape'].includes(e.key)){e.preventDefault();start()}});
 sp.focus({preventScroll:true});
 raf=requestAnimationFrame(frame);
})();
</script>
</body>
