/* ---- 条件の論理（分岐の到達可能性・矛盾の判定に使う） ---- */
function toTerms(g,limit){
 if(isGroup(g)){
  const any='any' in g&&!('all' in g), arr=any?g.any:g.all; if(!Array.isArray(arr)) return null;
  if(any){let out=[];for(const x of arr){const t=toTerms(x,limit);if(!t)return null;out=out.concat(t);if(out.length>limit)return null}return out}
  let out=[[]];for(const x of arr){const t=toTerms(x,limit);if(!t)return null;const nx=[];for(const a of out)for(const b of t){nx.push(a.concat(b));if(nx.length>limit)return null}out=nx}return out;
 }
 return [[g]];
}
function leafCons(c){
 const atom={atom:JSON.stringify(c)};
 if(!c||typeof c!=='object'||!c.left||typeof c.left!=='object'||!('field' in c.left)||'where' in c.left) return atom;
 const f=FS[c.left.field]; if(!f) return atom;
 const r=c.right, op=c.op, k=f.ref;
 if(op==='isNull') return {k,f,isNull:true};
 if(op==='isNotNull') return {k,f,isNull:false};
 if(!r||typeof r!=='object') return atom;
 let vals=null;
 if('picklist' in r||'object' in r) vals=Array.isArray(r.codes)?r.codes.map(String):null;
 else if('eventReasons' in r) vals=Array.isArray(r.eventReasons)?r.eventReasons.map(String):null;
 else if('const' in r&&r.const!==null&&typeof r.const!=='object') vals=[String(r.const)];
 if(!vals) return atom;
 if(op==='eq'||op==='in') return {k,f,inSet:vals};
 if(op==='ne'||op==='notIn') return {k,f,exSet:vals};
 if(ORDER_OPS.includes(op)&&'const' in r&&(r.type==='number'||r.type==='date')) return {k,f,op,v:String(r.const)};
 return atom;
}
const cmpv=(a,b)=>{const x=Number(a),y=Number(b);if(a!==''&&b!==''&&!isNaN(x)&&!isNaN(y))return x-y;return a<b?-1:a>b?1:0};
function domainOf(f){
 if(f.t.b==='boolean') return ['true','false'];
 if(f.t.b==='picklist'&&PL[f.t.pl]) return Object.keys(PL[f.t.pl].values);
 if(f.t.b==='object'&&REC[f.t.obj]) return Object.keys(REC[f.t.obj]);
 return null;
}
function inRange(v,st){
 if(st.lo){const c=cmpv(v,st.lo.v);if(c<0||(c===0&&!st.lo.inc))return false}
 if(st.hi){const c=cmpv(v,st.hi.v);if(c>0||(c===0&&!st.hi.inc))return false}
 return true;
}
function allowedSet(st){
 const dom=domainOf(st.f); let s=st.inSet?st.inSet.slice():dom?dom.slice():null;
 if(!s) return null;
 return s.filter(v=>!st.exSet.has(v)&&inRange(v,st));
}
function termState(term){
 const S={fields:{},atoms:new Set(),unsat:false,why:''};
 const no=(w)=>{if(!S.unsat){S.unsat=true;S.why=w}};
 for(const c of term){
  const x=leafCons(c);
  if(x.atom){S.atoms.add(x.atom);continue}
  const st=S.fields[x.k]||(S.fields[x.k]={f:x.f,inSet:null,exSet:new Set(),lo:null,hi:null,nul:undefined});
  if('isNull' in x){ if(st.nul!==undefined&&st.nul!==x.isNull) no(`${fl(x.f)} に「空である」と「空でない」の両方の条件があります`); st.nul=x.isNull; continue }
  if(st.nul===true) no(`${fl(x.f)} に「空である」と値の条件の両方があります`);
  st.nul=false;
  if(x.inSet) st.inSet=st.inSet?st.inSet.filter(v=>x.inSet.includes(v)):x.inSet.slice();
  if(x.exSet) x.exSet.forEach(v=>st.exSet.add(v));
  if(x.op){
   const b={v:x.v,inc:x.op==='ge'||x.op==='le'};
   if(x.op==='gt'||x.op==='ge'){ if(!st.lo||cmpv(b.v,st.lo.v)>0||(cmpv(b.v,st.lo.v)===0&&!b.inc)) st.lo=b }
   else { if(!st.hi||cmpv(b.v,st.hi.v)<0||(cmpv(b.v,st.hi.v)===0&&!b.inc)) st.hi=b }
  }
 }
 for(const st of Object.values(S.fields)){
  if(st.lo&&st.hi){const c=cmpv(st.lo.v,st.hi.v);if(c>0||(c===0&&!(st.lo.inc&&st.hi.inc))) no(`${fl(st.f)}の範囲の条件（${st.lo.v} と ${st.hi.v}）を同時に満たす値がありません`)}
  const a=allowedSet(st);
  if(a&&!a.length) no(`${fl(st.f)}の条件を同時に満たす値がありません`);
 }
 return S;
}
/* A の条件が成り立てば必ず B も成り立つか（安全側：判断できないときは false） */
function implies(A,B){
 for(const a of B.atoms) if(!A.atoms.has(a)) return false;
 for(const [k,sb] of Object.entries(B.fields)){
  const sa=A.fields[k]; if(!sa) return false;
  if(sb.nul===true){ if(sa.nul!==true) return false; continue }
  if(sa.nul===true) return false;
  const ab=allowedSet(sb), aa=allowedSet(sa);
  if(ab){ if(!aa||!aa.every(v=>ab.includes(v))) return false; continue }
  if(sb.inSet) return false;
  for(const v of sb.exSet) if(!(sa.exSet.has(v)||(aa&&!aa.includes(v))||(sa.inSet&&!sa.inSet.includes(v)))) return false;
  if(sb.lo){ if(!sa.lo){ if(!(aa&&aa.every(v=>inRange(v,{lo:sb.lo})))) return false } else {const c=cmpv(sa.lo.v,sb.lo.v); if(c<0||(c===0&&sa.lo.inc&&!sb.lo.inc)) return false} }
  if(sb.hi){ if(!sa.hi){ if(!(aa&&aa.every(v=>inRange(v,{hi:sb.hi})))) return false } else {const c=cmpv(sa.hi.v,sb.hi.v); if(c>0||(c===0&&sa.hi.inc&&!sb.hi.inc)) return false} }
 }
 return true;
}

function validate(sol){

 if(sc&&base){

 const filterCheck=(w,objs,path,needOne)=>{

  if(!isGroup(w)){err('shape',`${p}：where には "all" または "any" で条件を書いてください`);return}

   if(!arr.length) err('shape',`${q}：条件が空です`);
   arr.forEach((c,j)=>{

    const lo=c.left&&typeof c.left.field==='string'?c.left.field.split('.')[0]:null;

 };

 const recCheck=(o,codes,path,k)=>{
  const rs=REC[o], name=o==='FOEventReason'?'イベント事由':`${objLabel(o)}（${o}）`;
  if(!rs||!Object.keys(rs).length){warn(k,`${path}：${name}のレコードがデータモデルに登録されていないため、${codes.join('、')} が存在するか確認できません`);return}

   const s=recState(r);
   if(s==='inactive') err(k,`${path}：${name}の ${c}（${r.name}）は無効です`);
   else if(s==='expired') err(k,`${path}：${name}の ${c}（${r.name}）は有効期間が ${r.end} で終了しています`);
   else if(s==='future') warn(k,`${path}：${name}の ${c}（${r.name}）は ${r.start} から有効です。それより前の日付のデータでは使えません`);

 const constType=(v,path,ctx)=>{

   else err('shape',`${path}：定数の type「${t}」は使用できません（date / string / number / boolean）`);

  if(c===null){ if(!ctx.allowNull) err('format',`${path}：null（空欄）は値の設定にだけ使えます。空かどうかの判定には isNull / isNotNull を使ってください`); return {b:t,isNull:true} }

 const typeOf=(v,path,ctx={})=>{

   extraKeys(v,['field','where'],path);

   const argT=[];

  if(!b||typeof b!=='object'||Array.isArray(b)){err('shape',`${p}：分岐の形式が正しくありません`);binfo.push(null);return}
  Object.keys(b).filter(k=>k!=='if'&&k!=='then').forEach(k=>err('shape',`${p}：不明なキー「${k}」があります`));
  let cond=null;
  if(b.if==null) err('shape',`${p}：if がありません`);
  else if(!isGroup(b.if)) err('shape',`${p}：if には "all" または "any" が必要です`);
  else {
   Object.keys(b.if).filter(k=>k!=='all'&&k!=='any').forEach(k=>err('shape',`${p}：if に不明なキー「${k}」があります`));
   if('all' in b.if&&'any' in b.if) err('shape',`${p}：all と any は同時に使えません。入れ子にしてください`);
   const any='any' in b.if&&!('all' in b.if), arr=any?b.if.any:b.if.all;
   if(!Array.isArray(arr)) err('shape',`${p}：all / any は配列にしてください`);
   else { if(!arr.length&&any) err('logic',`${p}：any が空のため、この分岐は実行されません`); arr.forEach((x,j)=>checkCond(x,`${p} 条件${j+1}`)); cond=b.if }
  }
  const sets=checkActions(b.then,`${p} THEN`,true);
  cascadeCheck(b,p);
  binfo.push({p,i,cond,sets});
 });

 /* 存在・有効性・到達可能性 */
 const depth=+(CAT.settings&&CAT.settings.navDepth)||3;
 used.forEach((u,r)=>{
  const f=FS[r];
  if(!f){const o=r.split('.')[0]; err('exist',OBJ[o]?`項目 ${r} は ${objLabel(o)}（${o}）にありません${similarFields(r)}`:`項目 ${r} のオブジェクト「${o}」はデータモデルにありません`);return}
  if(f.status!=='active') err('exist',`項目 ${fl(f)}は無効化されています`);
  if(OBJ[f.obj].status!=='active') err('exist',`オブジェクト ${objLabel(f.obj)}（${f.obj}）は無効です`);
  if(R&&!R[f.obj]) err('reach',`${bl} から ${objLabel(f.obj)}（${r}）にはアクセスできません。参照項目・アソシエーションを ${depth} 段階以内でたどれる経路がありません`);
 });

 /* event とトリガー項目 */
 let trig=typeof sol.trigger_field==='string'?sol.trigger_field:null, trigSrc='trigger_field';
 if(!trig&&ev==='onChange'&&base) {const t=inferTrigger(sol.attach_to,baseId); if(t){trig=t;trigSrc='attach_to'}}
 const allSets=[...binfo.flatMap(b=>b?b.sets:[]),...elseSets];
 if(evd&&evd.needsTrigger){
  if(!trig) warn('event',`onChange のトリガー項目がありません。trigger_field に、値が変わったときにルールを実行する ${bl} の項目を書いてください`);
  else {
   const tf=FS[trig];
   if(!tf) err('event',`トリガー項目 ${trig} はデータモデルにありません`);
   else {
    if(base&&tf.obj!==baseId) err('event',`トリガー項目 ${fl(tf)}は base object（${bl}）の項目ではありません`);
    if(tf.status!=='active') err('event',`トリガー項目 ${fl(tf)}は無効化されています`);
    if(!(used.get(trig)||{}).read) warn('event',`トリガー項目 ${fl(tf)}${trigSrc==='attach_to'?'（attach_to から推定）':''} が条件や値で使われていません。意図したトリガーか確認してください`);
    if(allSets.includes(trig)) warn('logic',`トリガー項目 ${fl(tf)} 自身を設定しています。onChange が繰り返し実行される恐れがあります`);
   }
  }
 } else if(typeof sol.trigger_field==='string'&&evd) warn('event',`trigger_field は onChange のときだけ使います（event は ${ev}）。トリガー項目は無視されます`);

 /* 分岐のロジック：矛盾・到達不能・イベントと事由の対応 */
 const prev=[]; let always=-1;
 binfo.forEach(bi=>{
  if(!bi||!bi.cond) return;
  if(always>=0){err('logic',`${bi.p}：分岐${always+1} の条件が常に成り立つため、この分岐は実行されません`);return}
  const terms=toTerms(bi.cond,128); if(!terms) return;
  const states=terms.map(termState), live=states.filter(s=>!s.unsat);
  if(terms.length&&!live.length){err('logic',`${bi.p}：条件が矛盾しているため、この分岐は実行されません（${states[0].why}）`);return}
  if(live.length<states.length) states.forEach((s,j)=>{if(s.unsat) warn('logic',`${bi.p}：「または」でつないだ条件の一部（${j+1} 通り目の組み合わせ）が矛盾しています（${s.why}）`)});
  if(prev.length&&live.length){
   const cover=new Set(); const ok=live.every(a=>{const h=prev.find(x=>x.states.some(b=>implies(a,b)));if(h)cover.add(h.i+1);return !!h});
   if(ok) err('logic',`${bi.p}：この分岐の条件は、前の分岐（${[...cover].map(n=>'分岐'+n).join('、')}）にすべて含まれているため実行されません`);
  }
  live.forEach(s=>{
   const evs=Object.values(s.fields).filter(x=>x.f.t.pl==='event'), ers=Object.values(s.fields).filter(x=>x.f.t.obj==='FOEventReason');
   if(!evs.length||!ers.length) return;
   const allowEv=evs.map(allowedSet).filter(Boolean); if(!allowEv.length) return;
   const evOk=allowEv.reduce((a,b)=>a.filter(x=>b.includes(x)));
   ers.forEach(x=>{const codes=(allowedSet(x)||[]).filter(c=>ER[c]); const bad=codes.filter(c=>ER[c].event&&!evOk.includes(ER[c].event));
    if(bad.length) err('er',`${bi.p}：イベント事由 ${bad.map(c=>`${c}（${ER[c].ja}、event ${ER[c].event}）`).join('、')} は、同じ条件で指定したイベント（${evOk.join('・')||'なし'}）に属していません。${bad.length===codes.length?'この組み合わせは成り立ちません':'この事由は条件に当てはまりません'}`)});
  });
  prev.push({i:bi.i,states:live});
  if(live.some(s=>!Object.keys(s.fields).length&&!s.atoms.size)) always=bi.i;
 });
 if(always>=0&&N.els.length) err('logic',`ELSE：分岐${always+1} の条件が常に成り立つため、ELSE は実行されません`);

 /* 保守性：使われない変数、変数にまとめるべき繰り返し */
 Object.entries(VARS).forEach(([n,d])=>{if(!d.used) warn('maint',`${d.p}：定義されていますが、条件やアクションで使われていません。不要なら削除してください`)});
 const fnCount=new Map(), constCount=new Map();
 const walk=(x,inCond)=>{
  if(Array.isArray(x)) return x.forEach(y=>walk(y,inCond));
  if(!x||typeof x!=='object') return;
  if(typeof x.fn==='string'&&Array.isArray(x.args)&&x.args.length){const k=JSON.stringify(x);fnCount.set(k,(fnCount.get(k)||0)+1)}
  if(inCond&&x.op&&x.right&&typeof x.right==='object'&&'const' in x.right&&(x.right.type==='number'||x.right.type==='date')&&x.right.const!=null){
   const k=x.right.type+':'+x.right.const; constCount.set(k,(constCount.get(k)||0)+1)}

 N.branches.forEach(b=>{if(b&&typeof b==='object'){walk(b.if,true);walk(b.then,false)}}); walk(N.els,false);
 const dupFn=[...fnCount].filter(([,c])=>c>1).map(([k])=>k);
 dupFn.filter(k=>!dupFn.some(o=>o!==k&&o.includes(k))).forEach(k=>warn('maint',`同じ計算 ${exprText(JSON.parse(k))} が ${fnCount.get(k)} か所にあります。variables に変数としてまとめ、{"var": ...} で参照すると、変更が 1 か所で済みます`));
 [...constCount].filter(([,c])=>c>1).forEach(([k,c])=>{const i=k.indexOf(':');warn('maint',`判定値 ${k.slice(i+1)} が ${c} つの条件で使われています。基準が変わったときに 1 か所で直せるよう、定数の変数にすることを検討してください`)});

 /* 付帯情報とデータモデル */
 const refPat=/^[A-Za-z_]\w*\.[A-Za-z_]\w*$/, newText=list(sol.new_config_needed).map(String).join('\n');
 if(msgNoDef&&!/Message Definition|メッセージ/.test(newText)) warn('meta','メッセージ（raise）に code（Message Definition の externalCode）がありません。メッセージの文は Manage Data の Message Definition で先に作る必要があります。new_config_needed に書くか、既存の code を指定してください');
 list(sol.field_resolutions).forEach((r,i)=>{
  const q=`項目の解決 ${i+1}（${r&&r.concept||'?'}）`;
  if(!r||typeof r!=='object'){warn('meta',`${q}：形式が正しくありません`);return}
  if(r.kind!=null&&!['direct','similar','derived'].includes(r.kind)) warn('meta',`${q}：kind「${r.kind}」は direct / similar / derived のいずれかにしてください`);
  const c=Number(r.confidence);
  if(r.confidence!=null&&!(c>=0&&c<=1)) warn('meta',`${q}：confidence は 0〜1 の数値にしてください`);
  else if(c<.7&&!list(r.alternatives).length) warn('meta',`${q}：確信度が 70% 未満ですが、alternatives（別の候補）がありません`);
  if(typeof r.ref==='string'&&refPat.test(r.ref)){
   if(!FS[r.ref]){ if(!newText.includes(r.ref)) warn('meta',`${q}：${r.ref} はデータモデルにありません`) }
   else if(!used.has(r.ref)) warn('meta',`${q}：${fl(FS[r.ref])}はルールの中で使われていません。ルールと項目の解決が食い違っていないか確認してください`);
   /* 用語の照合：要件の言葉が、データモデルでは別の項目のラベル・同義語として登録されていないか */
   const cn=norm(r.concept);
   if(FS[r.ref]&&cn.length>=2){
    const hit=Object.values(FS).filter(f=>f.status==='active'&&[f.label,...f.syn].some(s=>norm(s)===cn));
    const considered=r.kind!=='direct'&&list(r.alternatives).some(a=>hit.some(f=>String(a).includes(f.ref)));
    if(hit.length&&!hit.some(f=>f.ref===r.ref)&&!considered) warn('meta',`${q}：「${r.concept}」はデータモデルでは ${hit.slice(0,3).map(fl).join('、')} のラベル・同義語です。${fl(FS[r.ref])}を選んだ理由を、意味の説明と照らして確認してください`);
   }
  }
 });
 used.forEach((u,r)=>{ if(!FS[r]&&newText.includes(r)) warn('meta',`${r} は new_config_needed で新規作成する前提の項目です。作成してデータモデルに追加するまで、このルールは設定できません`) });
 (newText.match(/[A-Za-z_]\w*\.[A-Za-z_]\w*/g)||[]).forEach(r=>{ if(FS[r]&&!used.has(r)) warn('meta',`new_config_needed の ${fl(FS[r])}はすでにデータモデルにあります。新規作成が必要か確認してください`) });
 used.forEach((u,r)=>{const f=FS[r]; if(f&&f.origin==='manual') warn('meta',`${fl(f)}はこの端末で手動追加した項目です。テナントに実在するか確認してください`)});
 if(/^\d{4}-\d{2}-\d{2}$/.test(CAT.version||'')){
  const days=Math.floor((new Date(TODAY)-new Date(CAT.version))/864e5), lim=+(CAT.settings&&CAT.settings.staleDays)||180;
  if(days>lim) warn('meta',`データモデルの同期データ（${CAT.version}）は ${days} 日前のものです。テナントの最新の設定と違う可能性があるため、メタデータから作り直してください`);

 return done();
}

function checkTreeHTML(results){

/* ---------- データモデルの構造図 ----------
   オブジェクトとピックリストのつながりを、無限に広がる方眼の画布に描く。
   つながりは edgesOf と同じ考え方（有効な参照項目・アソシエーション・クロスエンティティ・ピックリスト・カスケード）で作り、

   画布の状態（表示中の節点と位置・関係の切り替え・base object・視点）はこのブラウザに保存する。 */
function createModelMap(host){
 const SVGNS='http://www.w3.org/2000/svg', GRID=24;
 const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const KC={EC:'EC',Foundation:'FO',GO:'GO',MDF:'MDF',User:'USR',PL:'PL'};
 const KJA={EC:'Employee Central',Foundation:'Foundation Object',GO:'Generic Object',MDF:'カスタム MDF',User:'ユーザー',PL:'ピックリスト'};
 const REL={ref:{ja:'参照項目',g:'ref'},association:{ja:'アソシエーション',g:'assoc'},composite:{ja:'コンポジット',g:'assoc'},'valid-when':{ja:'Valid When',g:'assoc'},cross:{ja:'クロスエンティティ',g:'cross'},pl:{ja:'ピックリスト',g:'pl'},cascade:{ja:'カスケード',g:'pl'}};
 const RCOL={ref:'#A7A8AA',association:'#3FA9F5',composite:'#3FA9F5','valid-when':'#2BC4D6',cross:'#86BC25',pl:'#B8A050',cascade:'#B8A050'};
 const KCOL={EC:'#3FA9F5',Foundation:'#86BC25',GO:'#2BC4D6',MDF:'#FFA733',User:'#C46BD3',PL:'#E3C84A'};
 const plId=id=>'pl:'+id, isPl=id=>id.startsWith('pl:'), raw=id=>isPl(id)?id.slice(3):id;
 const exists=id=>isPl(id)?!!PL[raw(id)]:!!OBJ[id];
 const kindOf=id=>isPl(id)?'PL':(OBJ[id]&&KC[OBJ[id].kind]?OBJ[id].kind:'MDF');

 /* ---- 関係の一覧 ---- */
 let E=[], OUT={}, IN={};
 function build(){
  E=[];
  for(const id of Object.keys(OBJ)){
   const o=OBJ[id], ref={}, pls={};
   fieldsOf(id).forEach(f=>{
    if(f.status!=='active') return;
    if(f.t.obj&&OBJ[f.t.obj]) (ref[f.t.obj]=ref[f.t.obj]||[]).push(f);
    if(f.t.pl&&PL[f.t.pl]) (pls[f.t.pl]=pls[f.t.pl]||[]).push(f);
   });
   Object.entries(ref).forEach(([t,fs])=>E.push({from:id,to:t,kind:'ref',vias:fs.map(f=>({n:f.name,l:f.label})),many:false}));
   Object.entries(pls).forEach(([t,fs])=>E.push({from:id,to:plId(t),kind:'pl',vias:fs.map(f=>({n:f.name,l:f.label})),many:false}));
   o.associations.forEach(a=>{if(a&&OBJ[a.target]) E.push({from:id,to:a.target,kind:REL[a.type]?a.type:'association',vias:[{n:a.id,l:a.label||a.id}],many:a.multiplicity==='1:n'})});
   ((o.crossWrite&&o.crossWrite.targets)||[]).forEach(t=>{if(OBJ[t]) E.push({from:id,to:t,kind:'cross',vias:[{n:'crossWrite',l:'値を設定できる'}],many:false})});
  }
  for(const p of Object.values(PL)) if(p.parent&&PL[p.parent]) E.push({from:plId(p.id),to:plId(p.parent),kind:'cascade',vias:[{n:'parent',l:'親ピックリスト'}],many:false});
  E.forEach((e,i)=>e.i=i);
  OUT={}; IN={};
  E.forEach(e=>{(OUT[e.from]=OUT[e.from]||[]).push(e);(IN[e.to]=IN[e.to]||[]).push(e)});
 }

 /* ---- 状態 ---- */
 const SKEY='br.catMap.v1';
 const F={ref:true,assoc:true,cross:true,pl:false,in:false};

 const edgeOn=e=>F[REL[e.kind].g];
 function neighbors(id){

 function expand(id){
  const p=nodes.get(id), hs=hidden(id);

  const o=p.owner&&nodes.get(p.owner);
  let a0,spread;
  if(o){a0=Math.atan2(p.ty-o.ty,p.tx-o.tx);spread=Math.min(Math.PI*1.3,Math.max(.6,hs.length*.42))}
  else{a0=-Math.PI/2;spread=Math.PI*2}

  hs.forEach((h,i)=>{
   const a=o?a0+(hs.length===1?0:(i/(hs.length-1)-.5))*spread:a0+i*(Math.PI*2/hs.length);

 function removeNode(id){

 /* 重なりを避ける（新しい節点だけ動かす） */
 function relax(ids){
  const all=[...nodes.values()];
  for(let it=0;it<60;it++){
   let moved=false;
   for(const id of ids){
    const a=nodes.get(id), sa=size(id);
    for(const b of all){
     if(b===a) continue;
     const sb=size(b.id), dx=a.tx-b.tx, dy=a.ty-b.ty;
     const ox=(sa.w+sb.w)/2+36-Math.abs(dx), oy=(sa.h+sb.h)/2+30-Math.abs(dy);
     if(ox>0&&oy>0){
      moved=true; const hz=ox<oy*2.2, sx=dx>=0?1:-1, sy=dy>=0?1:-1;

      if(ids.includes(b.id)){if(hz) b.tx-=sx*ox/2; else b.ty-=sy*oy/2}
     }
    }
   }
   if(!moved) break;
  }
 }

   let rPrev=0; for(let d=1;d<=nav();d++){if(!by[d])continue;const r=Math.max(rPrev+300,by[d]*232/(Math.PI*2));rPrev=r;RINGS.push(r)}
   refresh();
  }else{refresh();kick();save()}
 }

 /* ---- 視点 ---- */
 const rect=()=>vp.getBoundingClientRect();
 const narrow=()=>host.classList.contains('narrow');
 function fly(id){
  const n=nodes.get(id); if(!n) return;
  const r=rect(), off=!narrow()&&!insp.hidden?170:0, offY=narrow()&&!insp.hidden?r.height*.22:0;
  view.tk=Math.max(view.k,.85); view.tx=r.width/2-off-n.tx*view.tk; view.ty=r.height/2-offY-n.ty*view.tk; viewAnim=true; kick();
 }
 function bounds(){
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  for(const n of nodes.values()){const s=size(n.id);x1=Math.min(x1,n.tx-s.w/2);y1=Math.min(y1,n.ty-s.h/2);x2=Math.max(x2,n.tx+s.w/2);y2=Math.max(y2,n.ty+s.h/2)}
  if(RINGS.length&&BASE&&nodes.has(BASE)){const b=nodes.get(BASE),r=RINGS[RINGS.length-1]+40;x1=Math.min(x1,b.tx-r);y1=Math.min(y1,b.ty-r);x2=Math.max(x2,b.tx+r);y2=Math.max(y2,b.ty+r)}
  return {x1,y1,x2,y2};
 }
 function fit(anim){
  if(!nodes.size) return;
  const b=bounds(), r=rect(); if(!r.width) return;
  const top=70, side=!narrow()&&!insp.hidden?340:0, bottom=narrow()?(insp.hidden?30:r.height*.5):30;
  const k=Math.min((r.width-side-60)/(b.x2-b.x1),(r.height-top-bottom-30)/(b.y2-b.y1),1.15);
  view.tk=Math.max(.15,k); view.tx=(r.width-side)/2-(b.x1+b.x2)/2*view.tk; view.ty=top+(r.height-top-bottom)/2-(b.y1+b.y2)/2*view.tk;
  if(anim){viewAnim=true;kick()}else{view.x=view.tx;view.y=view.ty;view.k=view.tk;applyView();readout()}
  save();
 }
 function zoomAt(f,cx,cy){
  const k=Math.min(2.6,Math.max(.12,view.k*f)), wx=(cx-view.x)/view.k, wy=(cy-view.y)/view.k;
  view.k=view.tk=k; view.x=view.tx=cx-wx*k; view.y=view.ty=cy-wy*k; viewAnim=false; applyView(); readout(); mini(); save();
 }
 let lastW={x:0,y:0};
 function readout(){$('.read').textContent=`X ${Math.round(lastW.x)} · Y ${Math.round(lastW.y)} · ${Math.round(view.k*100)}%`}
 function toWorld(cx,cy){const r=rect();return {x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k}}

 /* ---- 操作：背景のドラッグで移動、ホイール・ピンチで拡大縮小、節点のクリックで支線の開閉、ドラッグで移動（方眼に吸着）、ダブルクリックで詳細 ---- */
 const ptr=new Map(); let drag=null, pinch=null, lastTap={id:null,t:0};
 vp.addEventListener('pointerdown',ev=>{
  if(ev.target.closest('.nx,.nd')) return;
  try{vp.setPointerCapture(ev.pointerId)}catch(e){}
  ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k};if(drag&&drag.n)drag.n.drag=false;drag=null;return}
  const el=ev.target.closest('.bm-n');
  if(el){const n=nodes.get(el.dataset.id),w=toWorld(ev.clientX,ev.clientY);drag={n,ox:w.x-n.x,oy:w.y-n.y,sx:ev.clientX,sy:ev.clientY,moved:false}}
  else{drag={pan:true,sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y,moved:false};vp.classList.add('panning')}
 });
 vp.addEventListener('pointermove',ev=>{
  const w=toWorld(ev.clientX,ev.clientY); lastW=w; readout();
  if(ptr.has(ev.pointerId)) ptr.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(pinch&&ptr.size===2){const [a,b]=[...ptr.values()],r=rect();zoomAt(pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d/view.k,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return}
  if(!drag){const el=ev.target.closest('.bm-n'),h=el?el.dataset.id:null;if(h!==HOV){HOV=h;highlight()}return}
  const dx=ev.clientX-drag.sx, dy=ev.clientY-drag.sy;
  if(!drag.moved&&Math.hypot(dx,dy)>4) drag.moved=true;
  if(!drag.moved) return;
  if(drag.pan){view.x=view.tx=drag.vx+dx;view.y=view.ty=drag.vy+dy;viewAnim=false;applyView();mini()}
  else{const n=drag.n;n.drag=true;n.x=n.tx=w.x-drag.ox;n.y=n.ty=w.y-drag.oy;placeNodes();drawEdges()}
 });
 function endPtr(ev){
  ptr.delete(ev.pointerId);
  if(pinch){if(ptr.size<2)pinch=null;return}
  vp.classList.remove('panning');
  if(!drag) return;
  const d=drag; drag=null;
  if(d.pan){if(!d.moved&&SEL){SEL=null;refresh()}else if(d.moved)save();return}
  const n=d.n; n.drag=false;
  if(d.moved){n.tx=Math.round(n.tx/GRID)*GRID;n.ty=Math.round(n.ty/GRID)*GRID;kick();mini();save();return}
  const now=Date.now();
  if(lastTap.id===n.id&&now-lastTap.t<350){lastTap={id:null,t:0};toggle(n.id);openDetail(n.id);return}  /* 1 回目のクリックで開閉した支線は元に戻す */
  lastTap={id:n.id,t:now};
  toggle(n.id);
 }
 vp.addEventListener('pointerup',endPtr); vp.addEventListener('pointercancel',endPtr);
 vp.addEventListener('pointerleave',()=>{if(HOV&&!drag){HOV=null;highlight()}});
 vp.addEventListener('click',ev=>{const d=ev.target.closest('.nd');if(d){removeNode(d.closest('.bm-n').dataset.id);return}const b=ev.target.closest('.nx');if(b)toggle(b.closest('.bm-n').dataset.id)});
 vp.addEventListener('keydown',ev=>{const el=ev.target.closest('.bm-n');if(!el)return;if(ev.key==='Enter'){ev.preventDefault();openDetail(el.dataset.id)}else if(ev.key===' '){ev.preventDefault();toggle(el.dataset.id)}else if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();removeNode(el.dataset.id)}});
 vp.addEventListener('wheel',ev=>{ev.preventDefault();const r=rect();zoomAt(Math.exp(-ev.deltaY*(ev.ctrlKey?.01:.0015)),ev.clientX-r.left,ev.clientY-r.top)},{passive:false});

 /* ---- ミニマップ ---- */
 let mmT=null;
 function mini(){
  mc.clearRect(0,0,mm.width,mm.height);
  const r=rect(); if(!nodes.size||!r.width) return;
  const b=bounds(), vx1=-view.x/view.k, vy1=-view.y/view.k, vx2=vx1+r.width/view.k, vy2=vy1+r.height/view.k;
  const X1=Math.min(b.x1,vx1)-60, Y1=Math.min(b.y1,vy1)-60, X2=Math.max(b.x2,vx2)+60, Y2=Math.max(b.y2,vy2)+60;
  const s=Math.min(mm.width/(X2-X1),mm.height/(Y2-Y1)), ox=(mm.width-(X2-X1)*s)/2, oy=(mm.height-(Y2-Y1)*s)/2;
  mmT={X1,Y1,s,ox,oy};
  mc.strokeStyle='#75787B'; mc.globalAlpha=.4; mc.lineWidth=1;
  for(const e of VIS){const a=nodes.get(e.from),c=nodes.get(e.to);mc.beginPath();mc.moveTo(ox+(a.x-X1)*s,oy+(a.y-Y1)*s);mc.lineTo(ox+(c.x-X1)*s,oy+(c.y-Y1)*s);mc.stroke()}
  for(const n of nodes.values()){
   const z=size(n.id); mc.fillStyle=KCOL[kindOf(n.id)]; mc.globalAlpha=R&&!isPl(n.id)&&!R[n.id]?.3:1;
   mc.fillRect(ox+(n.x-z.w/2-X1)*s,oy+(n.y-z.h/2-Y1)*s,Math.max(2,z.w*s),Math.max(2,z.h*s));
  }
  mc.globalAlpha=1; mc.strokeStyle='#86BC25'; mc.lineWidth=3;
  mc.strokeRect(ox+(vx1-X1)*s,oy+(vy1-Y1)*s,(vx2-vx1)*s,(vy2-vy1)*s);
 }
 mm.addEventListener('pointerdown',ev=>{
  if(!mmT) return; const rc=mm.getBoundingClientRect(), r=rect();
  const wx=mmT.X1+((ev.clientX-rc.left)*mm.width/rc.width-mmT.ox)/mmT.s, wy=mmT.Y1+((ev.clientY-rc.top)*mm.height/rc.height-mmT.oy)/mmT.s;
  view.tk=view.k; view.tx=r.width/2-wx*view.k; view.ty=r.height/2-wy*view.k; viewAnim=true; kick();
 });

 /* ---- 開始・データの再読み込み ---- */
 function start(){
  BASE=null; R=null; RINGS=[]; bs.value='';
  nodes.clear(); clearDom(); SEL=null;
  /* 何もない図から始める。原点が画面の中央に来るようにする */
  const r=rect(); view.k=view.tk=1; view.x=view.tx=Math.round(r.width/2); view.y=view.ty=Math.round(r.height/2); viewAnim=false;
  applyView(); readout(); refresh(); save();
 }
 function restore(){
  const s=store.get(SKEY,null);
  if(!s||!Array.isArray(s.nodes)||!s.nodes.length) return false;
  Object.assign(F,s.F||{});
  s.nodes.forEach(([id,x,y,owner])=>{if(exists(id)) nodes.set(id,{id,x,y,tx:x,ty:y,owner:owner&&exists(owner)?owner:null,born:false})});
  if(!nodes.size) return false;
  if(s.base&&OBJ[s.base]) setBase(s.base,true);
  if(Array.isArray(s.view)){[view.x,view.y,view.k]=s.view;view.tx=view.x;view.ty=view.y;view.tk=view.k}
  return true;
 }
 /* データモデルが変わったとき（詳細画面から戻ったとき）に、つながりを作り直す */
 function reload(){
  build(); fillLists();
  for(const id of [...nodes.keys()]) if(!exists(id)) nodes.delete(id);
  for(const n of nodes.values()) if(n.owner&&!nodes.has(n.owner)) n.owner=null;
  if(BASE&&!OBJ[BASE]){BASE=null;R=null;RINGS=[]}
  if(BASE){const keepSel=SEL;setBase(BASE,true);SEL=keepSel}
  if(SEL&&!nodes.has(SEL)) SEL=null;
  clearDom(); refresh(); placeNodes(); drawEdges();
 }
 new ResizeObserver(()=>{
  const r=rect(); host.classList.toggle('narrow',r.width<720);
  if(r.width&&!sized){sized=true;if(restored){applyView();readout()}else start()}
  else if(r.width){applyView();mini()}
 }).observe(host);
 build(); fillLists();
 restored=restore();
 if(restored){refresh();placeNodes();drawEdges();applyView()}
 return {reload};
}

   OPS=d.ops;persistOps();closeSheet();refreshCat();toast('変更ログを読み込みました')}catch(e){toast('読み込めませんでした：'+e.message)}};rd.readAsText(f)};fi.click()};

 const r=s.querySelector('#reset'); r.onclick=()=>{

 };

  eff?{effectiveStartDate:f('有効開始日','Effective Start Date','Date',{required:true})}:{},
  {externalName:f('名称','Name','Translatable',{maxLength:255}),mdfSystemStatus:f('ステータス','Status','Picklist',{source:'status',required:true})});

 /* 再描画の前に、入力中の値を状態に残す */
 function keep(){const n=val();Object.assign(st,{label:n.label,en:n.en,desc:n.desc,syn:n.syn||[],kind:n.kind,status:n.status,effectiveDated:n.effectiveDated,baseObject:n.baseObject});if(isNew)st._id=g('#o-id').value}
 function add(){
  const err=g('#o-err'), nid=g('#o-id').value.trim(), n=val();
  if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(nid)){err.textContent='オブジェクト ID は英字で始まる半角英数字とアンダースコアで入力してください';return}
  if(OBJ[nid]){err.textContent=`${nid} はすでにあります`;return}
  if(BASE.objects[nid]){err.textContent=`${nid} は削除した同期オブジェクトと同じ ID です。「管理」から復元してください`;return}
  if(!n.label){err.textContent='日本語ラベルを入力してください';return}

(()=>{

 resize(); addEventListener('resize',resize);

 /* dot matrix on a sphere: latitude rings, dots spaced evenly along each ring */
 const P=[], RINGS=28;
 for(let i=0;i<=RINGS;i++){
  const lat=-Math.PI/2+Math.PI*i/RINGS, cr=Math.cos(lat), n=Math.max(1,Math.round(RINGS*2*cr));
  for(let j=0;j<n;j++){
   const lon=2*Math.PI*j/n+(i%2?Math.PI/n:0), rnd=()=>Math.random()-.5;
   P.push({x:cr*Math.cos(lon),y:Math.sin(lat),z:cr*Math.sin(lon),tw:Math.random()*6.283,sp:.5+Math.random()*1.3,jx:rnd(),jy:rnd(),jz:rnd()});
  }
 }

 sp.addEventListener('pointermove',e=>{tmx=(e.clientX/W-.5)*2;tmy=(e.clientY/H-.5)*2});

 function frame(now){
  const t=(now-t0)/1000, k=boom?clamp((now-boom)/BOOM_MS):0, e=k*k*k, fade=clamp((k-.35)/.65);
  mx+=(tmx-mx)*.05; my+=(tmy-my)*.05;
  const ry=(reduce?.6:t*.32+e*2.4)+mx*.5, rx=-.38+my*.3;
  const sy=Math.sin(ry),cy=Math.cos(ry),sx=Math.sin(rx),cxx=Math.cos(rx);
  const CX=W/2, CY=H*.44, F=3.4, breath=1+.018*Math.sin(t*1.7);
  cx.clearRect(0,0,W,H);

  /* soft core glow */
  const gl=cx.createRadialGradient(CX,CY,0,CX,CY,R*1.9);
  gl.addColorStop(0,`rgba(134,188,37,${.16*(1-fade)})`);gl.addColorStop(.5,`rgba(0,151,169,${.05*(1-fade)})`);gl.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=gl;cx.fillRect(0,0,W,H);

  /* project */
  const pts=[];
  for(const p of P){
   const d=breath*(1+e*p.sp*10);
   const x=(p.x+p.jx*e*.8)*d, y=(p.y+p.jy*e*.8)*d, z=(p.z+p.jz*e*.8)*d;
   const x1=x*cy+z*sy, z1=-x*sy+z*cy, y1=y*cxx-z1*sx, z2=y*sx+z1*cxx;
   const depth=F+z2; if(depth<.15) continue;
   const s=F/depth;
   pts.push([CX+x1*R*s, CY+y1*R*s, s, z2, p]);
  }
  pts.sort((a,b)=>b[3]-a[3]);

  cx.globalCompositeOperation='lighter';
  for(const [px,py,s,z2,p] of pts){
   const f=clamp((1-z2/breath)/2);                 // 1 = facing the viewer
   const tw=Math.sin(t*2.6+p.tw)>.985;              // occasional twinkle
   const c=tw?[255,255,255]:f>.55?mix(GREEN,LIGHT,(f-.55)/.45*.6):mix(TEAL,GREEN,f/.55);
   const a=(.16+.84*f)*(1-fade);
   if(a<=.01) continue;
   const r=(.7+1.7*f)*Math.min(s,6);
   if(f>.55||boom){cx.fillStyle=`rgba(${c},${a*.13})`;cx.beginPath();cx.arc(px,py,r*3.2,0,6.283);cx.fill()}
   cx.fillStyle=`rgba(${c},${a})`;cx.beginPath();cx.arc(px,py,r,0,6.283);cx.fill();
  }
  cx.globalCompositeOperation='source-over';

  /* shockwave from the click point */
  if(ring){
   const q=clamp((now-ring.t)/900), rr=q*Math.hypot(W,H)*.75;
   cx.lineWidth=2.5*(1-q)+.5;
   cx.strokeStyle=`rgba(134,188,37,${.85*(1-q)})`;cx.beginPath();cx.arc(ring.x,ring.y,rr,0,6.283);cx.stroke();
   cx.strokeStyle=`rgba(0,151,169,${.5*(1-q)})`;cx.beginPath();cx.arc(ring.x,ring.y,rr*.82,0,6.283);cx.stroke();
  }

  if(boom&&k>=1){finish();return}
  raf=requestAnimationFrame(frame);
 }
 function start(x,y){
  if(boom) return;
  boom=performance.now();
  if(!reduce) ring={x:x==null?W/2:x,y:y==null?H*.44:y,t:boom};
  sp.classList.add('go');
 }
 function finish(){
  if(ended) return; ended=true;
  cancelAnimationFrame(raf); removeEventListener('resize',resize); sp.remove();
 }
 sp.addEventListener('pointerdown',e=>start(e.clientX,e.clientY));
 sp.addEventListener('keydown',e=>{if(['Enter',' ','Escape'].includes(e.key)){e.preventDefault();start()}});
 sp.focus({preventScroll:true});
 raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
