<script>
/* Background shade 0 (Deloitte gray) … 100 (white). Surfaces blend continuously; text flips
   black/white at the point of best contrast. Runs before first paint (no flash). */
window.applyShade=function(v){
 var de0=document.documentElement;
 if(de0.classList.contains('iphone')){            /* iPhone layout keeps its original colours (CSS) */
  ['--bg','--card','--bar','--sep','--fill','--text','--text2','--text3','--tint','--rule-line','--similar-ink'].forEach(function(k){de0.style.removeProperty(k)});
  de0.style.colorScheme=''; de0.removeAttribute('data-theme');
  var m0=document.querySelector('meta[name="theme-color"]'); if(m0) m0.content='#000000';   /* iPhone 表示は黒だけ */
  return;
 }
 var t=Math.max(0,Math.min(100,+v||0))/100;
 if(matchMedia('(max-width:720px)').matches) t=0;   /* スマートフォンの幅では黒だけ */
 function L(a,b){return a.map(function(x,i){return x+(b[i]-x)*t})}
 var bg=L([35,36,38],[242,242,247]), card=L([48,50,53],[255,255,255]),
     bar=L([43,45,47,.88],[249,249,249,.86]), sep=L([151,153,155,.32],[60,60,67,.18]), fill=L([151,153,155,.2],[118,118,128,.12]);
 function lum(c){c=c.slice(0,3).map(function(x){x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
 var Lb=lum(bg), dark=1.05/(Lb+.05)>=(Lb+.05)/.05;   /* white text reads better? */
 var tx=dark?[255,255,255]:[0,0,0];
 function toward(f){return tx.map(function(x,i){return x+(bg[i]-x)*f})}
 function rgb(c){return 'rgb('+c.slice(0,3).map(Math.round).join(',')+')'}
 function rgba(c){return 'rgba('+c.slice(0,3).map(Math.round).join(',')+','+c[3].toFixed(3)+')'}
 var de=document.documentElement, s=de.style;
 s.setProperty('--bg',rgb(bg)); s.setProperty('--card',rgb(card)); s.setProperty('--bar',rgba(bar));
 s.setProperty('--sep',rgba(sep)); s.setProperty('--fill',rgba(fill));
 s.setProperty('--text',rgb(tx)); s.setProperty('--text2',rgb(toward(dark?.3:.45))); s.setProperty('--text3',rgb(toward(dark?.6:.72)));
 s.setProperty('--tint',dark?'var(--green)':'var(--green-ink)');
 s.setProperty('--rule-line',dark?'#53565A':'#000'); s.setProperty('--similar-ink',dark?'#FFB547':'#B86A00');
 s.colorScheme=dark?'dark':'light';
 if(dark) de.removeAttribute('data-theme'); else de.setAttribute('data-theme','light');
 var m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=rgb(bg);
};
window.savedShade=function(){try{var v=localStorage.getItem('br.shade');if(v!=null)return +v;return localStorage.getItem('br.theme')==='light'?100:0}catch(e){return 0}};
try{if(localStorage.getItem('br.layout')==='iphone')document.documentElement.classList.add('iphone')}catch(e){}
/* スマートフォンの幅（720px 以下）では、明るさの設定にかかわらず黒い背景にする。幅が変わったら塗り直す */
try{var nq=matchMedia('(max-width:720px)');if(nq.addEventListener)nq.addEventListener('change',function(){applyShade(savedShade())})}catch(e){}
/* サイドバーを閉じた状態を、最初の描画の前に反映する */
try{if(localStorage.getItem('br.sidebar')==='closed')document.documentElement.classList.add('sb-closed')}catch(e){}
applyShade(savedShade());
</script>
<link rel="manifest" href="manifest.webmanifest">

<style>
/* Default mode — グレー: Deloitte cool grays (#53565A / #75787B / #97999B / #BBBCBC) + green */
:root{
  --green:#86BC25; --green-ink:#26890D; --teal:#0097A9; --red:#DA291C; --amber:#ED8B00;
  --bg:#232426; --card:#303235; --text:#fff; --text2:#BBBCBC; --text3:#75787B;
  --sep:rgba(151,153,155,.32); --fill:rgba(151,153,155,.2); --bar:rgba(43,45,47,.88); --tint:var(--green);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rule-bg:#000; --rule-line:#53565A; --similar-ink:#FFB547;
  color-scheme:dark;
}
/* Lighter shades are applied as inline variables by applyShade() (see <head> script) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* macOS-style window: fills the whole browser viewport */
.app{position:fixed;inset:0;display:flex}
.screen{position:relative;flex:1;display:flex;min-width:0;height:100%;overflow:hidden;overflow:clip;background:var(--bg)}
.tabpanes,.pane{overflow:hidden;overflow:clip}
.tabpanes{position:relative;flex:1;min-width:0;height:100%}
.pane{position:absolute;inset:0;display:none}
.pane.on{display:block}
.view{position:absolute;inset:0;background:var(--bg);overflow-y:auto;overflow-x:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .25s}
.view.under{transform:translateX(-6%);opacity:0;pointer-events:none}
.view.enter{transform:translateX(6%);opacity:0}
.content{max-width:880px;margin:0 auto;padding:6px 24px 64px}
@media (prefers-reduced-motion:reduce){.view{transition:none}}

/* toolbar */
.navbar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg);box-shadow:0 .5px 0 var(--sep);transition:background .2s}
.navbar.solid{background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.navbar .mid{position:absolute;left:160px;right:160px;text-align:center;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.navbar.solid .mid{opacity:1}
.navbar>div:not(.mid){display:flex;align-items:center;gap:2px}
.navbtn{border:0;background:none;color:var(--tint);font-size:14px;padding:5px 10px;border-radius:6px;display:flex;align-items:center;gap:6px;min-height:28px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbtn:hover:not(:disabled){background:var(--fill)}
.navbtn:disabled{color:var(--text3)}
.navbtn svg{width:8px;height:14px}
.largetitle{font-size:26px;font-weight:700;letter-spacing:.1px;margin:20px 20px 4px;line-height:1.25}
.subtitle{margin:0 20px 14px;color:var(--text2);font-size:14px;line-height:1.5}
.tenant{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin:0 20px 4px;padding:3px 10px 3px 8px;border-radius:12px;background:var(--fill)}
.tenant i{width:8px;height:8px;border-radius:50%;background:var(--green)}

/* sidebar (replaces the iPhone tab bar) */
.tabbar{flex:none;width:224px;height:100%;display:flex;flex-direction:column;gap:2px;padding:14px 10px;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:.5px 0 0 var(--sep);z-index:30}
.apptitle{font-size:13px;font-weight:700;padding:6px 10px 14px;display:flex;align-items:center;gap:8px}
/* green dot mark (echoes the Deloitte dot and the splash sphere) */
.apptitle .appicon{width:14px;height:14px;margin:0 4px 0 2px;border-radius:50%;flex:none;
 background:radial-gradient(circle at 35% 32%,#C7E58C 0%,#86BC25 45%,#26890D 100%);
 box-shadow:0 0 8px rgba(134,188,37,.55);animation:dotGlow 3s ease-in-out infinite}
@keyframes dotGlow{0%,100%{box-shadow:0 0 6px rgba(134,188,37,.4)}50%{box-shadow:0 0 12px rgba(134,188,37,.75)}}
@media (prefers-reduced-motion:reduce){.apptitle .appicon{animation:none}}
/* Brand logo slot: icons/logo.svg (light) + icons/logo-dark.svg (black / gray modes). Falls back to the BR icon if missing */
.brandlogo{display:flex;align-items:center;padding-right:10px;margin-right:2px;border-right:1px solid var(--sep)}
.brandlogo img{height:18px;width:auto;max-width:110px}
.apptitle:not(.nologo) .appicon{display:none}
.apptitle.nologo .brandlogo{display:none}
.logo-light{display:none}
:root[data-theme="light"] .logo-light{display:block}
:root[data-theme="light"] .logo-dark{display:none}
.sidehead{font-size:11px;font-weight:600;color:var(--text3);padding:4px 10px 4px}
.tab{border:0;background:none;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--text);padding:7px 10px;border-radius:7px;text-align:left;width:100%}
.tab:hover{background:var(--fill)}
.tab.on{background:var(--fill);color:var(--tint);font-weight:600}
.tab svg{width:18px;height:18px;flex:none;color:var(--tint)}
.tab .tablabel{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidespacer{flex:1}
.tab.fs{color:var(--text2);font-weight:400}
.copyright{font-size:10px;color:var(--text3);padding:8px 10px 0;line-height:1.4}
/* background shade slider: gray → white track, Deloitte-green ball as the thumb */
.shade{display:flex;align-items:center;gap:8px;margin:2px 8px 12px;color:var(--text3)}
.shade svg{flex:none;width:14px;height:14px}
.shade input{flex:1;min-width:0;height:24px;margin:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
.shade input:focus-visible{outline:none}
.shade input::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#232426,#75787B 45%,#F2F2F7);box-shadow:inset 0 0 0 1px var(--sep)}
.shade input::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#232426,#75787B 45%,#F2F2F7);box-shadow:inset 0 0 0 1px var(--sep)}
.shade input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border:0;border-radius:50%;
 background:radial-gradient(circle at 35% 32%,#C7E58C 0%,#86BC25 45%,#26890D 100%);box-shadow:0 0 8px rgba(134,188,37,.6),0 1px 3px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.shade input::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;
 background:radial-gradient(circle at 35% 32%,#C7E58C 0%,#86BC25 45%,#26890D 100%);box-shadow:0 0 8px rgba(134,188,37,.6),0 1px 3px rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s}
.shade input:hover::-webkit-slider-thumb,.shade input:active::-webkit-slider-thumb{transform:scale(1.15);box-shadow:0 0 14px rgba(134,188,37,.85),0 1px 3px rgba(0,0,0,.35)}
.shade input:hover::-moz-range-thumb,.shade input:active::-moz-range-thumb{transform:scale(1.15);box-shadow:0 0 14px rgba(134,188,37,.85),0 1px 3px rgba(0,0,0,.35)}
.shade input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px rgba(134,188,37,.45),0 0 12px rgba(134,188,37,.8)}
.shade input:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px rgba(134,188,37,.45),0 0 12px rgba(134,188,37,.8)}
@media (max-width:720px){
  html:not(.iphone) .screen{flex-direction:column-reverse}
  html:not(.iphone) .tabbar{width:100%;height:calc(56px + env(safe-area-inset-bottom));flex-direction:row;padding:4px 6px env(safe-area-inset-bottom);box-shadow:0 -.5px 0 var(--sep);gap:0}
  html:not(.iphone) :is(.apptitle,.sidehead,.sidespacer,.tab.fs,.shade,.copyright){display:none}
  html:not(.iphone) .tab{flex-direction:column;gap:3px;font-size:10px;padding:4px 0;justify-content:center;border-radius:8px}
  html:not(.iphone) .tab .tablabel{flex:none}
  html:not(.iphone) .tab.on{background:none}
  html:not(.iphone) .tab svg{width:22px;height:22px}
  html:not(.iphone) .tabpanes{height:auto}
  html:not(.iphone) .navbar{padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}
  html:not(.iphone) .content{padding:6px 0 48px}
  html:not(.iphone) textarea.mono{font-size:16px}
}

.stephead{display:flex;align-items:center;gap:10px;margin:30px 20px 8px;font-size:16px;font-weight:600}
.stephead .n{width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--bg);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.stephead.done .n{background:var(--green);color:#000}
.stephead.off{color:var(--text3)} .stephead.off .n{background:var(--text3)}
.sechead{margin:22px 28px 7px;font-size:12px;font-weight:600;color:var(--text2)}
.secfoot{margin:7px 28px 0;font-size:12px;color:var(--text2);line-height:1.5}
.group{margin:0 16px;background:var(--card);border-radius:10px;overflow:hidden;box-shadow:0 0 0 .5px var(--sep)}
.row{display:flex;align-items:center;gap:12px;min-height:38px;padding:8px 14px;position:relative;width:100%;border:0;background:none;text-align:left;font-size:14px}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row .main{flex:1;min-width:0}
.row .t{line-height:1.3}
.row .s{font-size:12px;color:var(--text2);margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.row .v{color:var(--text2);font-size:13px;text-align:right;flex:none;max-width:55%;overflow-wrap:anywhere}
.chev{color:var(--text3);flex:none}
button.row:hover{background:var(--fill)}
/* history row: open area + delete button */
.row.hrow{padding:0;gap:0}
.row.hrow:hover{background:var(--fill)}
.hopen{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:8px 6px 8px 14px;text-align:left;font-size:14px}
.hdel{flex:none;display:flex;align-items:center;gap:4px;border:0;background:none;color:var(--text3);font-size:12px;font-weight:600;padding:6px 8px;margin-right:8px;border-radius:6px;white-space:nowrap;transition:background .15s,color .15s}
.hdel:hover{color:var(--red);background:var(--fill)}
.hdel.arm{color:#fff;background:var(--red)}
.hdel span:empty{display:none}
button.row:active{background:var(--fill)}
.row.stack{display:block}
.row.stack label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}

textarea.field{display:block;width:100%;border:0;background:none;resize:vertical;padding:10px 14px;font-size:14px;line-height:1.5;min-height:110px;outline:none}
textarea.mono{font-family:var(--mono);font-size:12px;line-height:1.5;min-height:240px}
input.inline,select.inline{border:0;background:none;outline:none;text-align:right;font-size:14px;color:var(--text2);width:100%}
select.inline{text-align-last:right;appearance:none;-webkit-appearance:none}
input.full{border:0;background:none;outline:none;font-size:14px;width:100%}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-top:4px}
.chip{flex:none;border:0;border-radius:14px;padding:5px 12px;font-size:13px;background:var(--card);color:var(--text);box-shadow:0 0 0 .5px var(--sep)}
.chip:hover,.chip:active{background:var(--fill)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.chip[aria-pressed="false"]{color:var(--text2)}
.tag{display:inline-block;padding:3px 9px;border-radius:11px;background:var(--fill);font-size:13px;margin:4px 6px 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto;margin:14px 0 0 16px;min-height:32px;padding:0 18px;border:0;border-radius:7px;background:var(--green);color:#000;font-size:14px;font-weight:600;vertical-align:top;box-shadow:0 .5px 1px rgba(0,0,0,.15)}
.btn:hover:not(:disabled){filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:default}
.btn.plain{background:var(--card);color:var(--tint);font-weight:500;box-shadow:0 0 0 .5px var(--sep),0 .5px 1px rgba(0,0,0,.08)}
.btn.danger{background:var(--card);color:var(--red);font-weight:500;box-shadow:0 0 0 .5px var(--sep),0 .5px 1px rgba(0,0,0,.08)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin:14px 16px 0}
.btnrow .btn{margin:0;width:auto;flex:none}
.linkbtn{border:0;background:none;color:var(--tint);font-size:13px;padding:6px 0;text-align:left}
.linkbtn:hover{text-decoration:underline}

.seg{display:flex;max-width:420px;margin:0 16px 4px;padding:2px;border-radius:8px;background:var(--fill)}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:4px 0;font-size:13px;font-weight:500}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}

details.prompt{margin:0 16px;background:var(--card);border-radius:12px;overflow:hidden}
details.prompt summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:15px;display:flex;justify-content:space-between;color:var(--text)}
details.prompt summary::-webkit-details-marker{display:none}
details.prompt summary span{color:var(--text2);font-size:13px}
details.prompt pre{margin:0;padding:12px 16px 16px;border-top:.5px solid var(--sep);font:12px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text2);max-height:320px;overflow:auto}

.verdict{scroll-margin-top:60px;margin:0 16px;border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:var(--card)}
.verdict .big{font-size:17px;font-weight:600}
.verdict .s{font-size:13px;color:var(--text2);margin-top:2px}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.badge.ok{background:var(--green)} .badge.ng{background:var(--red)}

/* rule card: the one bold element */
.rule{margin:0 16px;background:#000;color:#fff;border-radius:14px;padding:16px 16px 14px;font-size:15px;line-height:1.5}
.rule .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rule .tagd{font-size:12px;padding:3px 8px;border-radius:6px;background:#2C2C2E;color:#D1D1D6}
.rule .tagd b{color:#fff;font-weight:600}
.rule .when{font-size:13px;color:#AEAEB2;margin:-4px 0 8px}
.blk{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid #2C2C2E}
.blk.sub{border-top:0;padding-top:2px}
.kw.then{color:#C7E58C}
.cond+.cond{margin-top:4px}
.join{display:block;font-size:12px;color:#8E8E93;margin:2px 0 6px}
.grp{border-left:2px solid #3A3A3C;padding-left:10px;margin:2px 0}
.kw{font-weight:700;font-size:13px;letter-spacing:.3px;color:var(--green);padding-top:3px}
.kw.else{color:#8E8E93}
.expr{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.f{display:inline-flex;flex-direction:column;padding:4px 9px;border-radius:7px;background:#1C1C1E;border:1px solid #3A3A3C;line-height:1.25;max-width:100%}
.f small{font-size:11px;color:#8E8E93;overflow-wrap:anywhere}
.f.bad{border-color:#DA291C}
.lit{padding:4px 9px;border-radius:7px;background:rgba(134,188,37,.16);color:#C7E58C;border:1px solid rgba(134,188,37,.35);overflow-wrap:anywhere}
.op{color:#8E8E93;font-size:14px}
.fn{color:#7FD7E3;font-weight:600}
.paren{color:#8E8E93}
.rule{background:var(--rule-bg);border:1px solid var(--rule-line)}

.conf{display:flex;align-items:center;gap:8px;margin-top:6px}
.bar{flex:1;height:5px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar.low i{background:var(--amber)}
.pct{font-size:12px;color:var(--text2);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.pill.direct{background:rgba(134,188,37,.18);color:var(--tint)}
.pill.similar{background:rgba(237,139,0,.16);color:#B86A00}
.pill.derived{background:rgba(0,151,169,.14);color:var(--teal)}
.pill.sync{background:var(--fill);color:var(--text2)}
.pill.overridden,.pill.manual{background:rgba(0,151,169,.14);color:var(--teal)}
.pill.inactive{background:rgba(218,41,28,.12);color:var(--red)}
.pill.similar{color:var(--similar-ink)}
ul.plain{margin:0;padding:0;list-style:none}
ul.plain li{padding:9px 14px;font-size:14px;line-height:1.45;position:relative;overflow-wrap:anywhere}
ul.plain li+li::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}

.check{display:flex;gap:12px;padding:11px 16px;position:relative;align-items:flex-start}
.check+.check::before{content:"";position:absolute;top:0;left:48px;right:0;height:.5px;background:var(--sep)}
.ic{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px}
.ic.ok{background:var(--green)} .ic.ng{background:var(--red)}
.check .t{font-size:14px}
.check .err{font-size:13px;color:var(--red);margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
.check .s{font-size:13px;color:var(--text2);margin-top:2px}
.check .wrn{font-size:13px;color:var(--similar-ink);margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
.ic.warn,.badge.warn{background:var(--amber)}
/* 検証結果の一覧（総合判定 → 分類 → チェック項目） */
details.vtree>summary,details.ccat>summary{list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.vtree>summary::-webkit-details-marker,details.ccat>summary::-webkit-details-marker{display:none}
details.vtree>summary .main,details.ccat>summary .main{flex:1;min-width:0}
.chev{flex:none;width:8px;height:8px;margin:0 4px 0 6px;border-right:2px solid var(--text2);border-bottom:2px solid var(--text2);transform:rotate(-45deg);transition:transform .2s;opacity:.7}
details[open]>summary>.chev{transform:rotate(45deg)}
.vtree>.ctree{margin-top:8px}
.ccat{position:relative}
.ccat+.ccat::before{content:"";position:absolute;top:0;left:48px;right:0;height:.5px;background:var(--sep)}
.ccat>summary{display:flex;gap:12px;padding:11px 16px;align-items:center}
.ccat>summary .t{font-size:14px;font-weight:600}
.ccat>summary .s{font-size:12px;color:var(--text2);margin-top:1px}
.ccat .citems{border-top:.5px solid var(--sep);padding-bottom:2px}
.ccat .cdesc{font-size:12px;color:var(--text2);padding:8px 16px 0 50px;line-height:1.4}
.ccat .check{padding-left:50px}
.ccat .check+.check::before{left:84px}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.lit .litsub{display:block;font-size:10px;color:#8E8E93;margin-top:1px}
.ty-object{background:#53565A} .ty-attachment{background:#97999B}
.varref{padding:4px 9px;border-radius:7px;background:rgba(0,151,169,.18);color:#7FD7E3;border:1px solid rgba(0,151,169,.45);font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.kw.var{color:#7FD7E3}
.vardesc{font-size:12px;color:#AEAEB2;margin-top:4px}

.search{margin:12px 16px 4px;max-width:480px;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:7px;padding:0 8px;height:30px;color:var(--text2)}
.search input{flex:1;border:0;background:none;outline:none;font-size:14px;color:var(--text);min-width:0}
.typeicon{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.ty-date{background:#0097A9} .ty-string{background:#8E8E93} .ty-picklist{background:#26890D} .ty-boolean{background:#ED8B00} .ty-number{background:#5E5CE6} .ty-eventReason{background:#000;border:1px solid #3A3A3C}
.dotic{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:11px;background:var(--fill);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--green);outline-offset:2px}
.formerr{color:var(--red);font-size:12px;margin:8px 28px 0}

/* macOS-style sheet: drops from the top of the window */
.sheetwrap{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:0 16px;opacity:0;pointer-events:none;transition:opacity .2s}
.sheetwrap.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:calc(100% - 80px);overflow-y:auto;background:var(--bg);border-radius:0 0 12px 12px;padding:8px 0 24px;box-shadow:0 0 0 .5px var(--sep),0 20px 50px rgba(0,0,0,.3);transform:translateY(-24px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheetwrap.on .sheet{transform:none}
.grabber{display:none}
.sheethead{display:flex;justify-content:space-between;align-items:center;padding:4px 10px 4px 20px}
.sheethead h2{font-size:16px;margin:8px 0}
.sheet .btn{margin-bottom:4px}
.toast{position:absolute;left:50%;bottom:32px;transform:translate(-50%,20px);background:rgba(0,0,0,.82);color:#fff;font-size:14px;padding:10px 16px;border-radius:20px;opacity:0;transition:.25s;z-index:70;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{text-align:center;color:var(--text2);font-size:15px;padding:26px 28px;line-height:1.55}
/* Next-step guide: a laser comet running clockwise around the border (Deloitte green / teal) */
@property --guide-ang{syntax:'<angle>';initial-value:0deg;inherits:false}
.guide{position:relative;overflow:visible!important;--gr:10px;animation:guideGlow 2.4s ease-in-out infinite}
.group.guide{--gr:13px}
.navbtn.guide{--gr:9px}
.guide::before,.guide::after{content:"";position:absolute;inset:-3px;border-radius:var(--gr);pointer-events:none;z-index:3}
.guide::before{padding:2px;
 background:conic-gradient(from var(--guide-ang),transparent 0deg 190deg,rgba(0,151,169,.35) 240deg,#0097A9 285deg,#86BC25 330deg,#C7E58C 352deg,#fff 360deg);
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
 mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
 animation:guideSpin 2s linear infinite}
.guide::after{border:1px solid rgba(134,188,37,.4)}
@keyframes guideSpin{to{--guide-ang:360deg}}
@keyframes guideGlow{0%,100%{box-shadow:0 0 10px rgba(134,188,37,.22),0 0 2px rgba(0,151,169,.2)}50%{box-shadow:0 0 22px rgba(134,188,37,.5),0 0 6px rgba(0,151,169,.35)}}
@media (prefers-reduced-motion:reduce){.guide{animation:none;box-shadow:0 0 14px rgba(134,188,37,.4)}.guide::before{animation:none;background:#86BC25}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Splash: dot-matrix sphere; click anywhere to burst it and enter the app */
#splash{position:fixed;inset:0;z-index:1000;cursor:pointer;outline:none;color:#fff;font-family:var(--font);-webkit-user-select:none;user-select:none}
.splash-bg{position:absolute;inset:0;background:#000}
#splash canvas{position:absolute;inset:0;display:block}
.splash-text{position:absolute;left:0;right:0;bottom:10vh;text-align:center;pointer-events:none;transition:opacity .35s,transform .6s cubic-bezier(.2,.8,.2,1)}
.splash-title{font-size:30px;font-weight:700;letter-spacing:.08em}
.splash-sub{margin-top:10px;font-size:13px;color:#97999B;letter-spacing:.06em}
.splash-hint{display:inline-block;margin-top:30px;font-size:12px;letter-spacing:.32em;color:#86BC25;padding-bottom:6px;border-bottom:1px solid rgba(134,188,37,.45);animation:splashHint 2.2s ease-in-out infinite}
@keyframes splashHint{0%,100%{opacity:.35}50%{opacity:1}}
#splash.go{cursor:default;pointer-events:none}
.splash-copy{position:absolute;left:0;right:0;bottom:20px;text-align:center;font-size:11px;letter-spacing:.06em;color:#75787B;pointer-events:none;transition:opacity .35s}
#splash.go .splash-copy{opacity:0}
#splash.go .splash-text{opacity:0;transform:translateY(14px) scale(.97)}
#splash.go .splash-bg{opacity:0;transition:opacity .8s ease .3s}
@media (prefers-reduced-motion:reduce){.splash-hint{animation:none;opacity:1}#splash.go .splash-bg{transition:opacity .3s}}

/* =====================================================================
   iPhone layout (the original design) — active when <html class="iphone">
   ===================================================================== */
/* iPhone 表示は黒だけ */
html.iphone{
  --bg:#000; --card:#1C1C1E; --text:#fff; --text2:#98989F; --text3:#5A5A5F;
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --bar:rgba(22,22,24,.86); --tint:var(--green);
  --rule-bg:#0A0A0A; --rule-line:#2C2C2E; --similar-ink:#FFB547; color-scheme:dark;
}
html.iphone body{background:#2A2A2D;display:flex;overflow:auto;padding:24px;font-size:16px}
html.iphone .app{position:relative;inset:auto;display:block;margin:auto;flex:none;width:393px;height:852px;border-radius:58px;background:#000;padding:11px;box-shadow:0 0 0 2px #3A3A3C,0 30px 80px rgba(0,0,0,.35)}
html.iphone .screen{display:block;width:100%;height:100%;border-radius:47px}
html.iphone .tabpanes{position:absolute;inset:0;height:auto}
html.iphone .view{top:54px;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
html.iphone .view.under{transform:translateX(-28%);opacity:1;pointer-events:auto}
html.iphone .view.enter{transform:translateX(100%);opacity:1}
html.iphone .view::-webkit-scrollbar{display:none}
html.iphone .content{max-width:none;margin:0;padding:0 0 100px}
.island,.statusbar,.safetop{display:none}
html.iphone .island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:36px;border-radius:20px;background:#000;z-index:50}
html.iphone .statusbar{display:flex;position:absolute;top:0;left:0;right:0;height:54px;align-items:center;justify-content:space-between;padding:6px 34px 0 46px;background:var(--bg);color:var(--text);font-size:16px;font-weight:600;z-index:40;pointer-events:none}
.statusbar svg{display:block}
html.iphone .safetop{position:absolute;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--bg);z-index:40}
/* navigation bar */
html.iphone .navbar{height:44px;padding:0 8px;box-shadow:none}
html.iphone .navbar.solid{box-shadow:0 .5px 0 var(--sep)}
html.iphone .navbar .mid{left:96px;right:96px;font-size:17px}
html.iphone .navbtn{font-size:17px;padding:8px;gap:2px;min-height:44px;max-width:150px;border-radius:0}
html.iphone .navbtn:hover:not(:disabled){background:none}
html.iphone .navbtn svg{width:12px;height:20px}
html.iphone #newobj{display:none}   /* narrow nav bar: the same button sits under the object list */
html.iphone .largetitle{font-size:34px;letter-spacing:.2px;margin:2px 20px 4px;line-height:1.2}
html.iphone .subtitle{font-size:15px;line-height:1.45}
html.iphone .tenant{font-size:13px;padding:4px 10px 4px 8px;border-radius:14px}
/* tab bar */
html.iphone .tabbar{position:absolute;left:0;right:0;bottom:0;width:auto;height:83px;flex-direction:row;justify-content:space-around;gap:0;padding:6px 6px 0;box-shadow:0 -.5px 0 var(--sep)}
html.iphone :is(.apptitle,.sidehead,.sidespacer,.shade,.tab.fs,.copyright){display:none}
html.iphone .tab{flex:1;width:auto;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;font-size:10px;font-weight:500;color:var(--text3);padding:2px 0;border-radius:0}
html.iphone .tab:hover{background:none}
html.iphone .tab.on{background:none;color:var(--tint);font-weight:500}
html.iphone .tab svg{width:27px;height:27px;color:inherit}
html.iphone .tab .tablabel{flex:none}
/* content */
html.iphone .stephead{margin:28px 20px 8px;font-size:17px}
html.iphone .stephead .n{width:24px;height:24px;font-size:13px}
html.iphone .sechead{margin:22px 36px 7px;font-size:13px;font-weight:400}
html.iphone .secfoot{margin:7px 36px 0;font-size:13px}
html.iphone .formerr{margin:8px 36px 0;font-size:13px}
html.iphone .group{border-radius:12px;box-shadow:none}
html.iphone .row{min-height:44px;padding:10px 16px;font-size:17px}
html.iphone .row .s{font-size:13px}
html.iphone .row .v{font-size:15px}
html.iphone .row.stack label{font-size:13px}
html.iphone button.row:hover{background:none}
html.iphone .row.hrow{padding:0}
html.iphone .hopen{font-size:17px;padding:10px 6px 10px 16px}
html.iphone textarea.field{padding:12px 16px;font-size:17px;line-height:1.45;resize:none}
html.iphone textarea.mono{font-size:12.5px;min-height:200px}
html.iphone :is(input.inline,select.inline,input.full){font-size:17px}
html.iphone .chip{border-radius:16px;padding:7px 12px;font-size:14px;box-shadow:none}
html.iphone .btn{display:flex;width:calc(100% - 32px);margin:14px 16px 0;min-height:50px;padding:0 12px;border-radius:14px;font-size:17px;box-shadow:none}
html.iphone .btnrow{flex-wrap:nowrap}
html.iphone .btnrow .btn{flex:1;margin:0;width:auto}
html.iphone .linkbtn{font-size:15px;padding:8px 0}
html.iphone .seg{max-width:none;border-radius:9px}
html.iphone .seg button{border-radius:7px;padding:6px 0}
html.iphone .check .t{font-size:16px}
html.iphone ul.plain li{padding:11px 16px;font-size:15px}
html.iphone .search{max-width:none;margin:8px 16px 4px;border-radius:10px;height:36px}
html.iphone .search input{font-size:17px}
html.iphone .switch{width:51px;height:31px}
html.iphone .switch span{border-radius:16px}
html.iphone .switch span::after{width:27px;height:27px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
html.iphone .switch input:checked+span::after{transform:translateX(20px)}
/* bottom sheet & toast */
html.iphone .sheetwrap{align-items:flex-end;justify-content:stretch;padding:0}
html.iphone .sheet{max-width:none;max-height:85%;border-radius:14px 14px 0 0;padding:8px 0 40px;box-shadow:none;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
html.iphone .sheetwrap.on .sheet{transform:none}
html.iphone .grabber{display:block}
html.iphone .sheethead{padding:0 8px 0 20px}
html.iphone .sheethead h2{font-size:20px}
html.iphone .toast{bottom:110px}
/* real phones: no frame, full screen */
@media (max-width:500px){
  html.iphone body{display:block;background:var(--bg);padding:0;overflow:hidden}
  html.iphone .app{width:100%;height:100dvh;margin:0;border-radius:0;padding:0;box-shadow:none}
  html.iphone .screen{border-radius:0}
  html.iphone .island,html.iphone .statusbar{display:none}
  html.iphone .safetop{display:block}
  html.iphone .view{top:env(safe-area-inset-top)}
  html.iphone .content{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  html.iphone textarea.mono{font-size:16px}
  html.iphone .sheet{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
  html.iphone .tabbar{height:calc(56px + env(safe-area-inset-bottom))}
}

/* layout switch button (floating): iPhone → desktop on wide screens; round icon on narrow screens */
.layoutfab{display:none;position:fixed;z-index:900;border:0;align-items:center;background:var(--card);color:var(--tint);font-size:13px;font-weight:600;box-shadow:0 0 0 .5px var(--sep),0 4px 14px rgba(0,0,0,.18)}
.layoutfab svg{width:16px;height:16px;flex:none}
.layoutfab .to-phone,.layoutfab .to-mac{display:inline-flex;align-items:center;gap:6px}
.layoutfab .to-mac{display:none}
html.iphone .layoutfab .to-mac{display:inline-flex}
html.iphone .layoutfab .to-phone{display:none}
html.iphone .layoutfab{display:flex;top:20px;right:20px;padding:8px 14px;border-radius:18px}
@media (max-width:720px){
  html:not(.iphone) .layoutfab{display:flex;justify-content:center;right:14px;bottom:calc(68px + env(safe-area-inset-bottom));width:40px;height:40px;padding:0;border-radius:50%}
  html:not(.iphone) .layoutfab .lbl{display:none}
}
@media (max-width:500px){
  html.iphone .layoutfab{top:auto;right:14px;bottom:calc(68px + env(safe-area-inset-bottom));width:40px;height:40px;padding:0;border-radius:50%;justify-content:center}
  html.iphone .layoutfab .lbl{display:none}
}
.hidden{display:none!important}

/* ---------- データモデルの構造図（.bm 内だけに効く。背景は明るさの設定にかかわらず黒い方眼） ---------- */
.modesw{display:flex;padding:2px;border-radius:16px;background:var(--fill);gap:2px}
.modesw button{border:0;background:none;border-radius:14px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.modesw button svg{width:14px;height:14px;flex:none}
.modesw button:hover{color:var(--text)}
.modesw button.on{background:var(--green);color:#000}
.view.mapmode{overflow:hidden;display:flex;flex-direction:column}
.view.mapmode>.content{display:none}
.bm{--m-bg:#0B0B0B;--m-grid:rgba(255,255,255,.055);--m-grid2:rgba(255,255,255,.11);
 --m-card:#171717;--m-ink:#FFFFFF;--m-fg:#F2F2F2;--m-fg2:#A7A8AA;--m-fg3:#75787B;--m-line:#3A3A3A;--m-line2:#262626;
 --m-accent:#86BC25;--m-accent-ink:#9DD43A;--m-panel:rgba(20,20,20,.96);--m-shadow:0 1px 2px rgba(0,0,0,.5),0 8px 22px rgba(0,0,0,.45);
 --m-EC:#3FA9F5;--m-Foundation:#86BC25;--m-GO:#2BC4D6;--m-MDF:#FFA733;--m-User:#C46BD3;--m-PL:#E3C84A;
 --m-ref:#A7A8AA;--m-assoc:#3FA9F5;--m-vw:#2BC4D6;--m-cross:#86BC25;--m-pl:#B8A050;
 position:relative;flex:1;min-height:0;overflow:hidden;color:var(--m-fg);font-size:13px;color-scheme:dark;container-type:inline-size}
.bm[hidden]{display:none}
.bm-vp{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--m-bg);
 background-image:linear-gradient(var(--m-grid) 1px,transparent 1px),linear-gradient(90deg,var(--m-grid) 1px,transparent 1px),
  linear-gradient(var(--m-grid2) 1px,transparent 1px),linear-gradient(90deg,var(--m-grid2) 1px,transparent 1px)}
.bm-vp.panning{cursor:grabbing}
.bm-world{position:absolute;left:0;top:0;transform-origin:0 0}
.bm-edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
/* 連線 */
.bm-e path{fill:none}
.bm-e .b{stroke-width:1.4;opacity:.75;transition:opacity .2s}
.bm-e .f{stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1 26;opacity:0;animation:bmFlow 1.8s linear infinite}
.bm-e text{font:600 10.5px var(--mono);fill:var(--m-fg);paint-order:stroke;stroke:var(--m-bg);stroke-width:4px;opacity:0;transition:opacity .2s}
.bm-e.k-ref .b,.bm-e.k-ref .f{stroke:var(--m-ref)}
.bm-e.k-association .b{stroke:var(--m-assoc);stroke-dasharray:6 4}.bm-e.k-association .f{stroke:var(--m-assoc)}
.bm-e.k-composite .b{stroke:var(--m-assoc);stroke-width:3.6;opacity:.5}.bm-e.k-composite .f{stroke:var(--m-assoc)}
.bm-e.k-valid-when .b{stroke:var(--m-vw);stroke-dasharray:1.2 4.5;stroke-linecap:round;stroke-width:2}.bm-e.k-valid-when .f{stroke:var(--m-vw)}
.bm-e.k-cross .b{stroke:var(--m-cross);stroke-width:2;stroke-dasharray:9 5;animation:bmDash 1.1s linear infinite}.bm-e.k-cross .f{stroke:var(--m-cross)}
.bm-e.k-pl .b,.bm-e.k-cascade .b{stroke:var(--m-pl);stroke-width:1;opacity:.6}.bm-e.k-pl .f,.bm-e.k-cascade .f{stroke:var(--m-pl)}
.bm-e.k-cascade .b{stroke-dasharray:4 4}
.bm-edges.focus .bm-e{opacity:.1}
.bm-edges.focus .bm-e.hi,.bm-edges.focus .bm-e.path{opacity:1}
.bm-e.hi .b{opacity:1;stroke-width:2}.bm-e.hi .f{opacity:.9;stroke-dasharray:2 14;animation-duration:1s}.bm-e.hi text{opacity:1}
.bm-e.path .b{opacity:1;stroke:var(--m-accent);stroke-width:3.4;stroke-dasharray:none}
.bm-e.path .f{opacity:1;stroke:var(--m-ink);stroke-width:3;stroke-dasharray:2 12;animation-duration:.8s}
.bm-e.path text{opacity:1}
@keyframes bmFlow{to{stroke-dashoffset:-27}}
@keyframes bmDash{to{stroke-dashoffset:-14}}
.bm-ring{fill:none;stroke:var(--m-fg3);stroke-width:1;stroke-dasharray:2 6;opacity:.7}
.bm-ringlbl{font:700 10.5px var(--font);fill:var(--m-fg2);letter-spacing:.14em}
.bm-sweep{fill:url(#bm-sweep);transform-box:view-box;animation:bmSpin 7s linear infinite}
@keyframes bmSpin{to{transform:rotate(360deg)}}
/* 節点 */
.bm-n{position:absolute;left:0;top:0;width:196px;height:72px;box-sizing:border-box;--kc:var(--m-EC);
 background:var(--m-card);border:1px solid var(--m-line);border-top:3px solid var(--kc);border-radius:12px;
 padding:8px 12px 0;cursor:pointer;user-select:none;-webkit-user-select:none;box-shadow:var(--m-shadow);transition:border-color .15s,opacity .25s,filter .25s}
.bm-n:hover{border-color:var(--m-ink);border-top-color:var(--kc)}
.bm-n.sel{border:2px solid var(--m-ink);border-top:3px solid var(--kc);padding:7px 11px 0}
.bm-n.sel::after{content:"";position:absolute;left:14px;right:14px;bottom:-9px;height:4px;border-radius:2px;background:var(--m-accent)}
.bm-n.isbase{background:var(--m-ink);border-color:var(--m-ink);color:var(--m-bg)}
.bm-n.isbase .nid,.bm-n.isbase .nm{color:var(--m-fg3)}
.bm-n.isbase .nk{background:var(--m-accent);color:#000}
.bm-n.out{opacity:.3;filter:grayscale(1)}
.bm-n.inact{border-style:dashed;opacity:.6}
.bm-n.born{animation:bmBorn .4s cubic-bezier(.2,1.2,.4,1)}
@keyframes bmBorn{from{opacity:0;scale:.6}}
.bm-n .nh{display:flex;align-items:center;gap:7px;min-width:0}
.bm-n .nk{flex:none;font:700 9px var(--font);letter-spacing:.1em;color:var(--m-card);background:var(--kc);border-radius:4px;padding:2px 6px 1px}
.bm-n .nl{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-n .nid{font:400 11px var(--mono);color:var(--m-fg2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-n .nm{font-size:10.5px;color:var(--m-fg3);margin-top:2px;white-space:nowrap}
.bm-n .nx{position:absolute;right:-11px;top:50%;translate:0 -50%;min-width:26px;height:22px;border-radius:11px;padding:0 7px;
 border:1px solid var(--m-ink);background:var(--m-card);color:var(--m-ink);font:700 11px var(--font)}
.bm-n .nx:hover{background:var(--m-accent);border-color:var(--m-accent);color:#000}
.bm-n .nx.minus{background:var(--m-ink);color:var(--m-bg)}
.bm-n .nd{position:absolute;right:-9px;top:-9px;width:20px;height:20px;border-radius:50%;border:1px solid var(--m-line);background:var(--m-card);color:var(--m-fg2);font-size:13px;line-height:1;padding:0;opacity:0;transition:opacity .15s}
.bm-n:hover .nd,.bm-n.sel .nd,.bm-n:focus-visible .nd{opacity:1}
.bm-n .nd:hover{background:#DA291C;border-color:#DA291C;color:#fff}
.bm-empty{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(440px,calc(100% - 32px));box-sizing:border-box;text-align:center;padding:28px 24px;border:1px dashed var(--m-line);border-radius:16px;background:rgba(11,11,11,.7);pointer-events:auto}
.bm-empty b{display:block;font-size:16px;color:var(--m-ink);text-wrap:balance}
.bm-empty p{margin:10px 0 18px;font-size:12.5px;line-height:1.7;color:var(--m-fg2)}
.bm-empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bm-empty[hidden]{display:none}
.bm-n .rb{position:absolute;left:10px;top:-13px;font:700 9.5px var(--font);letter-spacing:.06em;color:var(--m-bg);background:var(--m-ink);padding:2px 8px 1px;border-radius:9px;white-space:nowrap}
.bm-n .rb.many{background:var(--m-MDF);color:#000}.bm-n .rb.cw{background:var(--m-accent);color:#000}
.bm-n.pl{width:170px;height:48px;padding:6px 14px 0 16px;--kc:var(--m-PL);border-top-width:1px;border-left:4px solid var(--kc);border-radius:24px}
.bm-n.pl.sel{border-left:4px solid var(--kc);padding:5px 13px 0 16px}
.bm-n.pl .nid{margin-top:2px}
/* 浮動パネル */
.bm-panel{position:absolute;background:var(--m-panel);border:1px solid var(--m-line);border-radius:14px;box-shadow:var(--m-shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bm-top{top:12px;left:12px;right:12px;display:flex;align-items:center;gap:8px;padding:7px 10px;overflow-x:auto;scrollbar-width:none;z-index:2}
.bm-top::-webkit-scrollbar{display:none}
.bm-sep{width:1px;height:24px;background:var(--m-line);flex:none}
.bm-search{position:relative;flex:1 1 150px;min-width:120px}
.bm-search input{width:100%;height:32px;box-sizing:border-box;background:#1F1F1F;border:1px solid var(--m-line);border-radius:16px;padding:0 14px 0 32px;font-size:12.5px;color:#fff}
.bm-search input::placeholder{color:var(--m-fg3)}
.bm-search input:focus{border-color:var(--m-accent);outline:none}
.bm-search svg{position:absolute;left:12px;top:9px;width:14px;height:14px;stroke:var(--m-fg2)}
.bm-chips{display:flex;gap:3px;flex:none}
.bm-chip{height:30px;border:1px solid transparent;border-radius:15px;background:transparent;padding:0 9px;font-size:12px;font-weight:600;color:var(--m-fg2);display:flex;align-items:center;gap:7px;white-space:nowrap}
.bm-chip i{width:14px;height:0;border-top:2px solid var(--cc);border-radius:1px}
.bm-chip:hover{color:#fff}
.bm-chip[aria-pressed="true"]{color:#fff;background:#262626;border-color:var(--m-accent)}
.bm-btn{height:32px;border-radius:16px;border:1px solid #53565A;background:transparent;color:var(--m-fg);padding:0 14px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.bm-btn:hover{border-color:var(--m-accent);color:var(--m-accent)}
.bm-btn.pri{background:var(--m-accent);border-color:var(--m-accent);color:#000}
.bm-btn.pri:hover{filter:brightness(1.08);color:#000}
.bm-btn.ico{display:flex;align-items:center;gap:6px;padding:0 14px 0 11px}
.bm-btn.ico svg{width:14px;height:14px;flex:none}
.bm-base{display:flex;align-items:center;gap:8px;flex:none;font:700 10px var(--font);letter-spacing:.16em;color:var(--m-fg2)}
.bm-base select{height:32px;max-width:200px;background:#1F1F1F;border:1px solid var(--m-line);border-radius:16px;padding:0 12px;font-size:12.5px;font-weight:600;letter-spacing:0;color:#fff}
.bm-base select option{background:#1F1F1F}
/* 詳細パネル */
.bm-insp{top:66px;right:12px;width:330px;max-height:calc(100% - 170px);overflow:auto;padding:20px 20px 22px;box-sizing:border-box;border-top:4px solid var(--kc);border-radius:16px;z-index:3}
.bm-insp[hidden]{display:none}
.bm-insp .ik{font:700 10px var(--font);letter-spacing:.16em;color:var(--kc)}
.bm-insp h2{margin:6px 0 2px;font-size:21px;line-height:1.3;color:var(--m-ink);text-wrap:balance}
.bm-insp .iid{font:400 12px var(--mono);color:var(--m-fg2)}
.bm-insp .idesc{color:var(--m-fg2);line-height:1.7;margin:12px 0 14px;font-size:12.5px}
.bm-insp .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 6px}
.bm-insp .stat{padding:8px 10px;border-radius:10px;background:var(--m-line2)}
.bm-insp .stat b{display:block;font-size:20px;color:var(--m-ink);font-variant-numeric:tabular-nums}
.bm-insp .stat span{font-size:10.5px;color:var(--m-fg3)}
.bm-insp .sh{font:700 10px var(--font);letter-spacing:.16em;color:var(--m-fg);margin:18px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--m-line)}
.bm-insp .evs{display:flex;flex-wrap:wrap;gap:4px}
.bm-insp .ev{font:400 11px var(--mono);border:1px solid var(--m-line);border-radius:10px;padding:1px 8px;color:var(--m-fg2)}
.bm-insp .rel{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:7px 8px}
.bm-insp .rel:hover{background:rgba(134,188,37,.1)}
.bm-insp .rel .dot{width:8px;height:8px;border-radius:50%;background:var(--kc);flex:none}
.bm-insp .rel .m{flex:1;min-width:0}
.bm-insp .rel .t{font-weight:600;font-size:12.5px}
.bm-insp .rel .s{font:400 10.5px var(--mono);color:var(--m-fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-insp .rel .rtag{font-size:10px;font-weight:600;color:var(--m-fg2);flex:none}
.bm-insp .path{border:1px solid rgba(134,188,37,.55);border-radius:12px;background:rgba(134,188,37,.07);padding:12px}
.bm-insp .chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 2px}
.bm-insp .chain .n{font-weight:700;font-size:12px;padding:2px 9px;background:var(--m-card);border:1px solid var(--kc);border-radius:11px}
.bm-insp .chain .v{font:400 10.5px var(--mono);color:var(--m-accent-ink);padding:0 3px}
.bm-insp .rexpr{margin-top:10px;font:400 11px var(--mono);color:var(--m-fg);word-break:break-all}
.bm-insp .note{font-size:11.5px;color:var(--m-fg2);line-height:1.65;margin-top:6px}
.bm-insp .ibtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.bm-insp .x{position:absolute;right:12px;top:14px;width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--m-fg2);font-size:14px}
.bm-insp .x:hover{color:var(--m-ink);background:var(--m-line2)}
/* 凡例・ミニマップ */
.bm-legend{left:12px;bottom:12px;padding:12px 14px;display:grid;grid-template-columns:auto auto;gap:6px 20px;font-size:11.5px;color:var(--m-fg2)}
.bm-legend .lh{grid-column:1/-1;font:700 10px var(--font);letter-spacing:.16em;color:var(--m-fg);border-bottom:1px solid var(--m-line);padding-bottom:4px}
.bm-legend div{display:flex;align-items:center;gap:8px;white-space:nowrap}
.bm-legend .lh{justify-content:space-between}
.bm-legend svg{width:34px;height:10px;flex:none}
.bm-legend .kd{width:10px;height:10px;border-radius:50%;background:var(--kc)}
.bm-legend.min{grid-template-columns:auto}
.bm-legend.min>:not(.lh){display:none}
.bm-legend .lh button{border:0;background:none;color:var(--m-fg2);font:inherit;padding:0 0 0 12px}
.bm-mini{right:12px;bottom:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
.bm-mini canvas{display:block;width:190px;height:120px;background:var(--m-bg);border:1px solid var(--m-line2);border-radius:10px;cursor:crosshair}
.bm-zrow{display:flex;align-items:center;gap:4px}
.bm-zrow button{width:28px;height:28px;border-radius:50%;border:1px solid var(--m-line);background:var(--m-card);color:var(--m-fg);font-weight:700;font-size:14px}
.bm-zrow button:hover{border-color:var(--m-ink)}
.bm-zrow button svg{width:14px;height:14px;display:block;margin:auto}
.bm-zrow .read{flex:1;text-align:right;font:400 10.5px var(--mono);color:var(--m-fg3);font-variant-numeric:tabular-nums;white-space:nowrap}
.bm.narrow .bm-legend,.bm.narrow .bm-mini canvas{display:none}
/* 上部のバーが入りきらない幅では、関係のボタンの線の見本を省いて 1 行に収める */
@container (max-width:1260px){.bm-chip i{display:none}.bm-chip{padding:0 10px}}
.bm.narrow .bm-insp{top:auto;bottom:8px;left:8px;right:8px;width:auto;max-height:48%}
@media (prefers-reduced-motion:reduce){.bm *{animation:none!important;transition:none!important}}

/* ---------- ホーム ---------- */
.apptitle.home-link{cursor:pointer;border-radius:8px;margin:0 0 4px;padding:6px 10px 10px}
.apptitle.home-link:hover{background:var(--fill)}
.apptitle.home-link.on{background:var(--fill)}
#pane-home .view>.navbar{display:none}
.home{max-width:1080px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 24px 64px;display:flex;flex-direction:column;gap:22px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:34px 34px 30px;background:var(--card);box-shadow:0 0 0 .5px var(--sep)}
.hero::before{content:"";position:absolute;right:-80px;top:-120px;width:460px;height:460px;border-radius:50%;
 background:radial-gradient(circle,rgba(134,188,37,.55) 1.3px,transparent 1.6px) 0 0/14px 14px;
 -webkit-mask:radial-gradient(circle at 50% 50%,#000 0,#000 30%,transparent 68%);mask:radial-gradient(circle at 50% 50%,#000 0,#000 30%,transparent 68%);opacity:.75}
.hero::after{content:"";position:absolute;right:40px;top:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(134,188,37,.22),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .date{font-size:13px;color:var(--text2);font-weight:500}
.hero h1{margin:8px 0 6px;font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.2px;text-wrap:balance}
.hero h1 i{display:inline-block;width:.28em;height:.28em;margin-left:.12em;border-radius:50%;background:var(--green);vertical-align:baseline}
.hero p{margin:0;max-width:560px;font-size:14px;line-height:1.7;color:var(--text2)}
.hero .hchips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 0;padding:0}
.hero .chip2{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);padding:4px 11px 4px 9px;border-radius:13px;background:var(--fill)}
.hero .chip2 i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.hero .chip2.warn i{background:var(--amber)}
.hsec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px -10px}
.hsec h2{margin:0;font-size:17px;font-weight:700}
.hsec span{font-size:12px;color:var(--text3)}
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.qa button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;border:0;border-radius:14px;padding:16px;background:var(--card);box-shadow:0 0 0 .5px var(--sep);transition:transform .15s,box-shadow .15s;min-width:0}
.qa button:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--green),0 8px 20px rgba(0,0,0,.18)}
.qa .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(134,188,37,.16);color:var(--tint)}
.qa .ic svg{width:20px;height:20px}
.qa b{font-size:14px}
.qa small{font-size:12px;color:var(--text2);line-height:1.5}
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mod{border-radius:16px;background:var(--card);box-shadow:0 0 0 .5px var(--sep);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.mod .mh{display:flex;align-items:center;gap:12px}
.mod .mh .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--fill);color:var(--tint);flex:none}
.mod .mh .ic svg{width:22px;height:22px}
.mod .mh b{display:block;font-size:16px}
.mod .mh small{display:block;font-size:12px;color:var(--text2);margin-top:2px}
.mod .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mod .num{border-radius:10px;background:var(--fill);padding:10px 12px;min-width:0}
.mod .num b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.mod .num span{font-size:11.5px;color:var(--text2)}
.mod .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.mod .links button{border:0;border-radius:16px;padding:6px 14px;font-size:13px;font-weight:600;background:var(--fill);color:var(--text)}
.mod .links button:hover{background:var(--green);color:#000}
.mod .links button.pri{background:var(--green);color:#000}
.hgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.hcard{border-radius:16px;background:var(--card);box-shadow:0 0 0 .5px var(--sep);padding:6px 0;min-width:0}
.hcard .ct{font-size:13px;font-weight:700;padding:12px 18px 8px}
.hcard .hr{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 18px;font-size:13.5px}
.hcard button.hr:hover{background:var(--fill)}
.hcard .hr .main{flex:1;min-width:0}
.hcard .hr .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .hr .s{font-size:12px;color:var(--text2);margin-top:2px}
.hcard .dotic{flex:none}
.hcard .none{padding:6px 18px 16px;font-size:13px;color:var(--text2);line-height:1.6}
.hcard .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 18px;font-size:13px}
.hcard .kv span{color:var(--text2)}
.hcard .kv b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.hcard .news{padding:4px 18px 14px;font-size:13px;line-height:1.65;color:var(--text2)}
.hcard .news b{color:var(--text)}
.hcard .news button{margin-top:10px;border:0;border-radius:16px;padding:6px 14px;font-size:13px;font-weight:600;background:var(--green);color:#000}
@media (max-width:900px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}.mods,.hgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){html:not(.iphone) .home{padding:12px 16px 48px}.hero{padding:26px 22px}.hero h1{font-size:27px}}
html.iphone .home{padding:8px 16px 40px;gap:18px}
html.iphone .hero{padding:24px 20px}
html.iphone .hero h1{font-size:26px}
html.iphone .qa{grid-template-columns:repeat(2,minmax(0,1fr))}
html.iphone :is(.mods,.hgrid){grid-template-columns:minmax(0,1fr)}

/* ---------- サイドバーの開閉（デスクトップ表示のみ。左上のボタンで切り替え、Ctrl+B / ⌘B でも切り替え） ---------- */
.sbtoggle{display:none}
.apptitle .appname{min-width:0;white-space:normal;word-break:keep-all;line-height:1.3}
@media (min-width:721px){
 html:not(.iphone) .sbtoggle{display:grid;place-items:center;position:absolute;left:12px;top:11px;z-index:40;width:30px;height:30px;padding:0;border:0;border-radius:7px;background:none;color:var(--text2)}
 html:not(.iphone) .sbtoggle:hover{background:var(--fill);color:var(--text)}
 html:not(.iphone) .sbtoggle svg{width:18px;height:18px}
 html:not(.iphone) .apptitle.home-link{padding-left:40px}
 html:not(.iphone) .tabbar{transition:width .22s cubic-bezier(.2,.8,.2,1),padding .22s,visibility 0s}
 html.sb-closed:not(.iphone) .tabbar{width:0;padding-left:0;padding-right:0;overflow:hidden;visibility:hidden;box-shadow:none;transition:width .22s cubic-bezier(.2,.8,.2,1),padding .22s,visibility 0s .22s}
 html.sb-closed:not(.iphone) .navbar{padding-left:52px}
}
@media (min-width:721px) and (prefers-reduced-motion:reduce){html:not(.iphone) .tabbar{transition:none}}

@media (max-width:720px){html:not(.iphone) .sbhint{display:none}}
html.iphone .sbhint{display:none}

/* ---------- 浮いた下部ナビゲーション（スマートフォンと iPhone 表示）
   画面の下に浮かぶ丸いバーに、機能の分類（ホーム・ビジネスルール設計・データモデル管理）を並べる。
   バーは左右にスワイプでき、分類をタップすると、その分類の機能を選ぶ浮いたパネルが開く ---------- */
.mnav,.mpop,.mnav-scrim{display:none}
.mpop[hidden],.mnav-scrim[hidden]{display:none!important}
html.mpop-open .layoutfab{display:none!important}
@media (max-width:720px){
 html:not(.iphone) .tabbar{display:none}
 html:not(.iphone) .mnav{display:block}
 html:not(.iphone) :is(.mpop,.mnav-scrim){display:block}
 html:not(.iphone) .view{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
 html:not(.iphone) .toast{bottom:calc(98px + env(safe-area-inset-bottom))}
 html:not(.iphone) .layoutfab{bottom:calc(96px + env(safe-area-inset-bottom))}
}
html.iphone .tabbar{display:none}
html.iphone .mnav{display:block;bottom:26px}
html.iphone :is(.mpop,.mnav-scrim){display:block}
html.iphone .mpop{bottom:98px}
html.iphone .view{padding-bottom:104px}
@media (max-width:500px){
 html.iphone .mnav{bottom:calc(14px + env(safe-area-inset-bottom))}
 html.iphone .mpop{bottom:calc(86px + env(safe-area-inset-bottom))}
 html.iphone .view{padding-bottom:calc(92px + env(safe-area-inset-bottom))}
 html.iphone .layoutfab{bottom:calc(96px + env(safe-area-inset-bottom))}
}
.mnav{position:absolute;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;height:62px;border-radius:31px;
 background:rgba(30,30,32,.78);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
 box-shadow:0 0 0 .5px rgba(255,255,255,.16),0 12px 32px rgba(0,0,0,.55)}
.mnav-track{display:flex;gap:4px;height:100%;padding:7px;box-sizing:border-box;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;scrollbar-width:none;overscroll-behavior-x:contain;
 -webkit-mask:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);mask:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);border-radius:31px}
.mnav-track::-webkit-scrollbar{display:none}
.mnav-item{flex:none;scroll-snap-align:center;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px 0 14px;border:0;border-radius:24px;background:transparent;color:#fff;font-size:13.5px;font-weight:600;white-space:nowrap;transition:background .2s,color .2s,transform .12s}
.mnav-item:first-child{margin-left:6px}.mnav-item:last-child{margin-right:6px}
.mnav-item svg{width:22px;height:22px;flex:none}
.mnav-item .up{width:10px;height:10px;opacity:.6;margin-left:-2px}
.mnav-item:active{transform:scale(.94)}
.mnav-item.on{background:#fff;color:#000}
.mnav-item.open{background:rgba(255,255,255,.16)}
.mnav-item.on.open{background:#fff}
.mnav-scrim{position:absolute;inset:0;z-index:59;background:rgba(0,0,0,.38);animation:mfade .2s}
.mpop{position:absolute;left:16px;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:61;border-radius:24px;padding:8px;
 background:rgba(30,30,32,.94);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
 box-shadow:0 0 0 .5px rgba(255,255,255,.16),0 18px 40px rgba(0,0,0,.55);transform-origin:50% 100%;animation:mpop .22s cubic-bezier(.2,1.1,.4,1)}
.mpop .ph{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#98989F;padding:8px 12px 6px;letter-spacing:.04em}
.mpop .pi{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:#fff;text-align:left;padding:10px 12px;border-radius:16px}
.mpop .pi:hover,.mpop .pi:active{background:rgba(255,255,255,.08)}
.mpop .pi .ic{width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;background:rgba(134,188,37,.16);color:var(--green)}
.mpop .pi .ic svg{width:22px;height:22px}
.mpop .pi .m{flex:1;min-width:0}
.mpop .pi b{display:block;font-size:15px;font-weight:600}
.mpop .pi small{display:block;font-size:12px;color:#98989F;margin-top:2px;line-height:1.45}
.mpop .pi .ck{width:18px;height:18px;flex:none;color:var(--green);visibility:hidden}
.mpop .pi.on b{color:var(--green)}
.mpop .pi.on .ck{visibility:visible}
@keyframes mpop{from{opacity:0;transform:translateY(12px) scale(.96)}}
@keyframes mfade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.mpop,.mnav-scrim{animation:none}.mnav-item{transition:none}}

<script>
'use strict';
/* =========================================================
   1. Storage (per-device; survives reloads, not shared)
   ========================================================= */
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const KEY={ops:'br.dm.ops.v2',hist:'br.history.v1',all:'br.allObjects.v1',catSeg:'br.catSeg.v1',catMode:'br.catMode.v1',
 old:{over:'br.overrides.v1',manual:'br.manualFields.v1',objOver:'br.objOverrides.v1',objManual:'br.manualObjects.v1'}};
let ALL_OBJ=store.get(KEY.all,true);
const allObjIds=()=>Object.keys(OBJ);
const clone=x=>x===undefined?undefined:JSON.parse(JSON.stringify(x));
const pad2=n=>String(n).padStart(2,'0');
const stamp=()=>{const d=new Date();return `${d.getMonth()+1}月${d.getDate()}日 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`};
const TODAY=(()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`})();

/* =========================================================
   2. Data model: sync layer (data/catalog.js) + change log (this device)
      CAT = BASE + OPS（変更ログを順に適用した、この端末の現在のデータモデル）
   ========================================================= */
const KN=window.BR_KNOWLEDGE||{events:[],functions:{},concepts:[],cards:[]};
const FN=KN.functions||{}, EVENTS=KN.events.map(e=>e.name), EVT=Object.fromEntries(KN.events.map(e=>[e.name,e]));
/* SuccessFactors のデータ型 → 検証で使う基本型 */
const DT={
 String:{b:'string',ja:'テキスト',ic:'文'}, Translatable:{b:'string',ja:'翻訳可能テキスト',ic:'訳'},
 Long:{b:'number',int:1,ja:'整数',ic:'#'}, Decimal:{b:'number',ja:'小数',ic:'#.'},
 Date:{b:'date',ja:'日付',ic:'日'}, DateTime:{b:'date',dt:1,ja:'日時',ic:'時'}, Boolean:{b:'boolean',ja:'はい/いいえ',ic:'Y'},
 Picklist:{b:'picklist',ja:'選択肢（Picklist）',ic:'選'},
 FoundationObject:{b:'object',ja:'Foundation Object',ic:'FO'},
 GenericObject:{b:'object',ja:'Generic Object',ic:'GO'},
 User:{b:'object',ja:'ユーザー',ic:'人'},
 AutoNumber:{b:'string',ro:1,ja:'自動採番',ic:'No'}, Attachment:{b:'attachment',ja:'添付ファイル',ic:'添'}
};
const TYPE_JA={date:'日付',string:'テキスト',picklist:'選択肢',boolean:'はい/いいえ',number:'数値',int:'整数',object:'オブジェクト参照',attachment:'添付ファイル',any:'任意の値',collection:'集合（1:n の項目）',datetime:'日時'};
const KIND_JA={EC:'Employee Central',Foundation:'Foundation Object',GO:'Generic Object',MDF:'カスタム MDF',User:'ユーザー'};
/* 種類ごとの既定の event（オブジェクトに「使える event」がないときに使う）。Foundation Object は onChange を使えず、MDF に onView はない */
const MDF_EVENTS=['onInit','onValidate','onChange','onSave','onPostSave','onDelete','onLoad'];
const KIND_EVENTS={EC:['onInit','onChange','onSave','onView'],Foundation:['onInit','onSave'],GO:MDF_EVENTS,MDF:MDF_EVENTS,User:[]};
/* ルールシナリオと MDF の目的（data/knowledge.js） */
const SCN=Object.fromEntries((KN.scenarios||[]).map(s=>[s.id,s])), MPUR=KN.mdfPurposes||{};
const ACT_JA={set:'値の設定（Set）',property:'項目の必須・表示（プロパティ）',raise:'メッセージ（Raise Message）',create:'レコードの作成（Create）',delete:'レコードの削除（Delete）',workflow:'ワークフロー'};
const SEV_JA={error:'エラー',warning:'警告',info:'情報'};
const VIS_JA={edit:'表示・編集できる',view:'表示だけ（読み取り専用）',none:'表示しない'};
const ASSOC_JA={association:'アソシエーション',composite:'コンポジット','valid-when':'Valid When'};
const REC_STATE_JA={inactive:'無効',future:'有効開始前',expired:'有効期間終了'};

/* v1（スキーマなし）の catalog.js を読み込んだときの変換 */
function v1Field(f){
 const t=f.type, x={label:f.label,en:f.en||'',dataType:t==='date'?'Date':t==='number'?'Decimal':t==='boolean'?'Boolean':t==='picklist'?'Picklist':t==='eventReason'?'FoundationObject':'String'};
 if(t==='picklist'&&f.picklist) x.source=f.picklist; if(t==='eventReason') x.source='FOEventReason';
 if(f.required) x.required=true; if(f.desc) x.desc=f.desc; if(f.syn&&f.syn.length) x.syn=f.syn.slice();
 if(f.inactive||f.status==='inactive') x.status='inactive';
 return x;
}
function upgradeCatalog(c){
 c=clone(c||{}); if(c.schema>=2) return c;
 const out={schema:2,tenant:c.tenant||'(未読み込み)',version:c.version||'',settings:{navDepth:3,staleDays:180},objects:{},picklists:{},records:{}};
 for(const [id,pl] of Object.entries(c.picklists||{})) out.picklists[id]={label:id,en:id,status:'A',values:pl};
 for(const [code,e] of Object.entries(c.eventReasons||{})) (out.records.FOEventReason=out.records.FOEventReason||{})[code]={name:e.ja,en:e.en,status:e.status,attrs:{event:e.event}};
 for(const [id,o] of Object.entries(c.objects||{})){
  const fields={}; for(const [n,f] of Object.entries(o.fields||{})) fields[n]=v1Field(f);
  out.objects[id]={label:o.label,en:o.en||'',kind:o.kind||'MDF',status:'active',baseObject:true,events:KIND_EVENTS[o.kind]||KIND_EVENTS.MDF,
   associations:(o.nav||[]).map(t=>({id:'to_'+t,target:t,multiplicity:'1:1',type:'association'})),fields};
 }
 return out;
}
const BASE=upgradeCatalog(window.BR_CATALOG||{tenant:'(未読み込み)'});
BASE.objects=BASE.objects||{}; BASE.picklists=BASE.picklists||{}; BASE.records=BASE.records||{}; BASE.settings=BASE.settings||{navDepth:3,staleDays:180};

/* change log */
function newOp(path,op,value,before,note){return {id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),at:stamp(),path,op,value:clone(value),before:clone(before),note:note||''}}
function migrateV1(){
 const g=k=>store.get(k,null), over=g(KEY.old.over)||{}, man=g(KEY.old.manual)||{}, oo=g(KEY.old.objOver)||{}, mo=g(KEY.old.objManual)||{};
 const ops=[], note='旧バージョンから移行';
 for(const [id,m] of Object.entries(mo)) if(!BASE.objects[id]) ops.push(newOp(['objects',id],'set',{label:m.label,en:m.en||'',kind:m.kind||'MDF',status:'active',baseObject:true,
  events:KIND_EVENTS[m.kind]||KIND_EVENTS.MDF,associations:(m.nav||[]).map(t=>({id:'to_'+t,target:t,multiplicity:'1:1',type:'association'})),fields:{}},undefined,note));
 for(const [id,ov] of Object.entries(oo)){ const b=BASE.objects[id]; if(!b) continue;
  if(ov.deleted){ops.push(newOp(['objects',id],'del',undefined,undefined,note));continue}
  ['label','en','kind'].forEach(k=>{if(k in ov&&ov[k]!==b[k]) ops.push(newOp(['objects',id,k],'set',ov[k],b[k],note))});
 }
 for(const m of Object.values(man)) if(m&&m.obj&&m.name) ops.push(newOp(['objects',m.obj,'fields',m.name],'set',v1Field(m),undefined,note));
 for(const [ref,ov] of Object.entries(over)){
  const i=ref.indexOf('.'), o=ref.slice(0,i), f=ref.slice(i+1), bf=BASE.objects[o]&&BASE.objects[o].fields[f]; if(!bf) continue;
  ['label','desc','syn'].forEach(k=>{if(k in ov) ops.push(newOp(['objects',o,'fields',f,k],'set',ov[k],bf[k],note))});
  if('status' in ov) ops.push(newOp(['objects',o,'fields',f,'status'],'set',ov.status,bf.status||'active',note));
 }
 return ops;
}
let OPS=store.get(KEY.ops,null);
if(!Array.isArray(OPS)){OPS=migrateV1();store.set(KEY.ops,OPS)}
function getPath(o,p){for(const k of p){if(o==null||typeof o!=='object')return undefined;o=o[k]}return o}
function applyOp(root,op){
 const par=getPath(root,op.path.slice(0,-1)), k=op.path[op.path.length-1];
 if(!par||typeof par!=='object') return;
 if(op.op==='del') delete par[k]; else par[k]=clone(op.value);
}

let CAT, OBJ={}, FS={}, FBY={}, PL={}, REC={}, ER={}, REACH={};
const same=(a,b)=>JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b);
function tdesc(f){
 const d=DT[f.dataType]||DT.String;
 return {b:d.b,int:!!d.int,dt:!!d.dt,pl:d.b==='picklist'?f.source:undefined,obj:d.b==='object'?(f.dataType==='User'?'User':f.source):undefined};
}
function rebuild(){
 CAT=clone(BASE); OPS.forEach(op=>{if(!op.reverted) applyOp(CAT,op)});
 CAT.objects=CAT.objects||{}; CAT.picklists=CAT.picklists||{}; CAT.records=CAT.records||{};
 OBJ={}; FS={}; FBY={}; PL={}; REC={}; REACH={};
 for(const [id,o] of Object.entries(CAT.objects)){
  const b=BASE.objects[id], {fields,...attrs}=o, battrs=b?(({fields,...r})=>r)(b):null;
  OBJ[id]={id,...attrs,label:o.label||id,en:o.en||'',desc:o.desc||'',syn:Array.isArray(o.syn)?o.syn:[],status:o.status||'active',events:o.events||KIND_EVENTS[o.kind]||[],
   associations:Array.isArray(o.associations)?o.associations:[],crossWrite:o.crossWrite||null,baseObject:o.baseObject!==false,
   origin:!b?'manual':same(attrs,battrs)?'sync':'overridden'};
  FBY[id]=[];
  for(const [n,f] of Object.entries(fields||{})){
   const bf=b&&b.fields&&b.fields[n], d=DT[f.dataType]||DT.String, ref=id+'.'+n;
   const x={...f,ref,obj:id,name:n,label:f.label||n,en:f.en||'',desc:f.desc||'',syn:f.syn||[],status:f.status||'active',
    readOnly:!!(f.readOnly||d.ro),required:!!f.required,origin:!bf?'manual':same(f,bf)?'sync':'overridden'};
   x.t=tdesc(f); x.type=x.t.b;
   FS[ref]=x; FBY[id].push(x);
  }
 }
 for(const [id,p] of Object.entries(CAT.picklists)){
  const b=BASE.picklists[id];
  PL[id]={id,...p,label:p.label||id,en:p.en||'',desc:p.desc||'',syn:Array.isArray(p.syn)?p.syn:[],status:p.status||'A',values:p.values||{},origin:!b?'manual':same(p,b)?'sync':'overridden'};
 }
 for(const [o,rs] of Object.entries(CAT.records)) REC[o]=rs||{};
 ER={}; Object.entries(REC.FOEventReason||{}).forEach(([c,r])=>ER[c]={event:(r.attrs||{}).event,ja:r.name,en:r.en,status:r.status});
}
rebuild();
const fieldsOf=o=>FBY[o]||[];
const objLabel=id=>OBJ[id]?OBJ[id].label:id;
const fl=f=>`${f.label}（${f.ref}）`;
const dtText=f=>{const d=DT[f.dataType]||DT.String;return d.ja+(f.t&&f.t.pl?' '+f.source:f.t&&f.t.obj?' → '+f.t.obj:'')};
function recState(r){
 if(!r) return 'missing';
 if(r.status&&r.status!=='A') return 'inactive';
 if(r.start&&r.start>TODAY) return 'future';
 if(r.end&&r.end<TODAY) return 'expired';
 return 'ok';
}
/* 参照項目・アソシエーション・クロスエンティティでたどれるオブジェクト（幅優先、navDepth 段階まで） */
function edgesOf(id){
 const o=OBJ[id]; if(!o) return [];
 const es=[];
 fieldsOf(id).forEach(f=>{if(f.t.obj&&f.status==='active') es.push({to:f.t.obj,via:f.name,label:f.label,many:false,kind:'field'})});
 o.associations.forEach(a=>{if(a&&a.target) es.push({to:a.target,via:a.id,label:a.label||a.id,many:a.multiplicity==='1:n',kind:a.type||'association'})});
 return es;
}
function reachFrom(base){
 if(REACH[base]) return REACH[base];
 const R={}, depth=+(CAT.settings&&CAT.settings.navDepth)||3;
 if(!OBJ[base]) return REACH[base]=R;
 R[base]={path:[],many:false,depth:0};
 const cw=OBJ[base].crossWrite;
 if(cw&&Array.isArray(cw.targets)) cw.targets.forEach(t=>{if(OBJ[t]&&!R[t]) R[t]={path:[{from:base,via:'cross',label:'クロスエンティティ',to:t,many:false,kind:'cross'}],many:false,depth:1,cross:true}});
 let frontier=[base];
 for(let d=1;d<=depth;d++){
  const next=[];
  for(const from of frontier) for(const e of edgesOf(from)){
   if(!OBJ[e.to]) continue;
   const many=R[from].many||e.many, cur=R[e.to];
   if(!cur||(cur.many&&!many)){R[e.to]={path:[...R[from].path,{from,via:e.via,label:e.label,to:e.to,many:e.many,kind:e.kind}],many,depth:d};next.push(e.to)}
  }
  frontier=next;
 }
 return REACH[base]=R;
}
function pathText(base,to){
 const r=reachFrom(base)[to]; if(!r) return '';
 return [objLabel(base),...r.path.map(s=>`${s.kind==='cross'?'（クロスエンティティ）':s.label+(s.many?'［1:n］':'')} → ${objLabel(s.to)}`)].join(' › ');
}

/* =========================================================
   3. Local analysis (no AI): concepts + candidate fields
   ========================================================= */
const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
function analyze(text){
 const t=norm(text), score={}, why={};
 const add=(ref,n,reason)=>{if(!FS[ref])return;score[ref]=(score[ref]||0)+n;(why[ref]=why[ref]||new Set()).add(reason)};
 const concepts=KN.concepts.filter(c=>c.aliases.some(a=>norm(a).length>=2&&t.includes(norm(a))));
 concepts.forEach(c=>c.refs.forEach(r=>add(r,6,'概念「'+c.name+'」')));
 for(const f of Object.values(FS)){
  if(f.status!=='active') continue;
  if(norm(f.label).length>=2&&t.includes(norm(f.label))) add(f.ref,8,'ラベル');
  f.syn.forEach(s=>{if(norm(s).length>=2&&t.includes(norm(s))) add(f.ref,5,'同義語「'+s+'」')});
  if(norm(f.en).length>=4&&t.includes(norm(f.en))) add(f.ref,4,'英語ラベル');
 }
 const pickHits=[];
 for(const [pid,p] of Object.entries(PL)) for(const [code,v] of Object.entries(p.values)){
  if(norm(v.ja).length>=2&&t.includes(norm(v.ja))){pickHits.push({pid,code,ja:v.ja});
   Object.values(FS).filter(f=>f.t.pl===pid).forEach(f=>add(f.ref,4,'選択肢「'+v.ja+'」'))}
 }
 const recHits=[];
 for(const [o,rs] of Object.entries(REC)) for(const [code,r] of Object.entries(rs)){
  if(norm(r.name).length>=2&&t.includes(norm(r.name))){recHits.push({obj:o,code,name:r.name});
   Object.values(FS).filter(f=>f.t.obj===o).forEach(f=>add(f.ref,4,(o==='FOEventReason'?'イベント事由「':'レコード「')+r.name+'」'))}
 }
 /* ピックリスト自体のラベル・同義語 → そのピックリストを使う項目 */
 for(const p of Object.values(PL)){
  if(p.status!=='A') continue;
  const w=[p.label,...p.syn].find(s=>norm(s).length>=2&&t.includes(norm(s)));
  if(w) Object.values(FS).filter(f=>f.t.pl===p.id).forEach(f=>add(f.ref,3,'ピックリスト「'+w+'」'));
 }
 /* オブジェクト自体のラベル・同義語 → オブジェクトの候補 */
 const objHits=[];
 for(const o of Object.values(OBJ)){
  if(o.status!=='active') continue;
  const w=[o.label,...o.syn].find(s=>norm(s).length>=2&&t.includes(norm(s)));
  if(w) objHits.push({id:o.id,word:w});
 }
 const fields=Object.keys(score).sort((a,b)=>score[b]-score[a]).map(r=>({ref:r,score:score[r],why:[...why[r]]}));
 const objScore={}; fields.forEach(f=>{const o=FS[f.ref].obj;objScore[o]=(objScore[o]||0)+f.score});
 objHits.forEach(h=>{objScore[h.id]=(objScore[h.id]||0)+10});
 let objects=Object.keys(objScore).sort((a,b)=>objScore[b]-objScore[a]);
 if(!objects.length) objects=['EmpJob'].filter(o=>OBJ[o]);
 return {concepts,fields,objects,pickHits,recHits,objHits};
}

const RULES_COMMON=`- 項目、選択肢のコード、レコードのコード、イベント事由、関数は「使用できるデータ」にあるものだけを使う。存在しないものを作らない

function extractJSON(text){
 const t=String(text||'').trim(); if(!t) return {error:'貼り付けられた内容がありません'};
 const cands=[]; const re=/```(?:json)?\s*([\s\S]*?)```/gi; let m;
 while((m=re.exec(t))) cands.push(m[1]);
 const a=t.indexOf('{'), b=t.lastIndexOf('}'); if(a>=0&&b>a) cands.push(t.slice(a,b+1));
 cands.push(t);
 let lastErr='';
 for(const c of cands){
  for(const s of [c, c.replace(/,\s*([}\]])/g,'$1')]){
   try{const v=JSON.parse(s); if(v&&typeof v==='object'&&!Array.isArray(v)) return {sol:v}}catch(e){lastErr=e.message}
  }
 }
 return {error:'JSON を読み取れませんでした（'+lastErr+'）。AI の回答に ```json のコードブロックが含まれているか確認してください。'};
}

/* Accepts branches[], or if/then(+else_if[])(+else); returns ordered branches and else actions */
function normalize(sol){
 const issues=[]; let branches=[], els=[];
 if(sol.branches!=null){
  if(Array.isArray(sol.branches)) branches=sol.branches.slice(); else issues.push('「branches」は配列にしてください');
  if(sol.if!=null||sol.then!=null) issues.push('「branches」と「if / then」が両方あります。どちらか一方にしてください');
 } else {
  if(sol.if!=null||sol.then!=null) branches.push({if:sol.if,then:sol.then});
  const ei=sol.else_if!=null?sol.else_if:sol.elseIf;
  if(ei!=null){ if(Array.isArray(ei)) branches.push(...ei); else issues.push('「else_if」は配列にしてください') }
 }
 if(sol.else!=null){ if(Array.isArray(sol.else)) els=sol.else; else issues.push('「else」は配列にしてください') }
 const last=branches[branches.length-1];
 if(branches.length>1&&last&&typeof last==='object'&&!('if' in last)&&!els.length){ els=Array.isArray(last.then)?last.then:[]; branches.pop() }
 if(!branches.length) issues.push('分岐がありません。「branches」に少なくとも 1 つの分岐を書いてください');

}
